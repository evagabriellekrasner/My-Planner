<style>
/* Layout: three pages under one header (Today, Classes, Study). Friendly rounded type, white cards on a tinted page, one bright theme color the person picks. */
:root{
  --paper:#f4f1f4; --sheet:#fdfcfd; --ink:#3a3540; --ink-2:#8a8290; --rule:#e8e2e8;
  --accent:#9a87b5; --accent-ink:#ffffff; --accent-soft:#eee8f3; --accent-2:#c98e9e;
  --late:#c26a68; --late-bg:#f7e6e4; --done:#b3abb6; --scrim:rgba(50,40,60,.35);
  --shadow:0 1px 0 rgba(80,60,90,.03), 0 6px 22px rgba(80,60,90,.06);
  --imp:#f6edc4; --imp-edge:#e2cf86; --hl-1:#e9d896; --hl-2:#e4b0bc; --hl-3:#b2d1bb; --hl-4:#adc4dd; --hl-5:#e7bb99; --hl-6:#c4b6db; --on-hl:#3a3540;
  --f-display:"Fredoka", "Nunito", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Nunito", system-ui, sans-serif;
}
:root[data-palette="ocean"]{ --paper:#f0f3f5; --rule:#dfe6eb; --accent:#7f9cb4; --accent-soft:#e5edf2; --accent-2:#9bb5a6; --ink:#33393f; --ink-2:#7f8a93; }
:root[data-palette="sunset"]{ --paper:#f6f1ec; --rule:#ebe1d8; --accent:#c39478; --accent-soft:#f3e8df; --accent-2:#b7a07a; --ink:#3f3530; --ink-2:#8e8078; }
:root[data-palette="rose"]{ --paper:#f7f1f1; --rule:#ece0e1; --accent:#c08d98; --accent-soft:#f4e7e9; --accent-2:#a598bd; --ink:#3e3337; --ink-2:#8f7f85; }
:root[data-palette="sage"]{ --paper:#f1f4f0; --rule:#e0e7de; --accent:#87a08c; --accent-soft:#e6eee6; --accent-2:#b9a58a; --ink:#323a34; --ink-2:#7d887f; }

}

:root[data-theme="dark"][data-palette="rose"]{ --accent:#d3a7b0; --accent-soft:#372b2e; --accent-2:#b7abcf; --paper:#1d191a; --sheet:#262123; --rule:#382f32; --ink:#f0e7e9; --ink-2:#ab9ca1; }

/* class colors: 10 muted shades that follow the chosen theme */
:root{ --c1:#cbc8e4; --c2:#cdb9df; --c3:#b4a8dc; --c4:#bc9fd0; --c5:#a38ecc; --c6:#b07dca; --c7:#8276bc; --c8:#8c64b9; --c9:#5551b8; --c10:#7251a4; }

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --c1:#bebbdd; --c2:#c3abd9; --c3:#a89ad6; --c4:#b392c9; --c5:#9880c6; --c6:#a76ec4; --c7:#7569b5; --c8:#8156b3; --c9:#4a47ae; --c10:#6b4c9a; }}
:root[data-theme="dark"]{ --c1:#bebbdd; --c2:#c3abd9; --c3:#a89ad6; --c4:#b392c9; --c5:#9880c6; --c6:#a76ec4; --c7:#7569b5; --c8:#8156b3; --c9:#4a47ae; --c10:#6b4c9a; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-palette="ocean"]{ --c1:#bad7de; --c2:#a9bbda; --c3:#98c2d7; --c4:#90a2cb; --c5:#7ea8c8; --c6:#6c81c6; --c7:#66a2b7; --c8:#547eb6; --c9:#45a2b0; --c10:#49739c; }

}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:1140px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1;margin:0;overflow-wrap:anywhere}
.rename{border:0;background:transparent;color:var(--ink-2);font-size:13px;padding:4px 6px;border-radius:6px}
.rename:hover{color:var(--accent);background:var(--sheet)}
.brand input{font-family:var(--f-display);font-weight:800;font-size:24px;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:2px 8px;width:min(320px,70vw)}
.today-lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.banner{background:var(--accent-soft);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.banner.warn{background:var(--late-bg)}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}

.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.tabs h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px 4px;font-weight:500}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 10px;min-width:0}
.tab:hover{background:var(--sheet);border-color:var(--rule)}
.tab[aria-current="true"]{background:var(--sheet);border-color:var(--accent);font-weight:700}
.tab .sw{flex:none;width:14px;height:14px;border-radius:4px;background:var(--ink-2)}
.tab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:500}
.tab .ct.late{color:var(--late)}
.addclass{margin-top:6px;border:1.5px dashed var(--rule);background:transparent;border-radius:10px;padding:9px 10px;text-align:left;color:var(--accent);font-weight:700}
.addclass:hover{border-color:var(--accent);background:var(--sheet)}

.sw-1{background:var(--c1)!important}.sw-2{background:var(--c2)!important}.sw-3{background:var(--c3)!important}.sw-4{background:var(--c4)!important}.sw-5{background:var(--c5)!important}.sw-6{background:var(--c6)!important}.sw-7{background:var(--c7)!important}.sw-8{background:var(--c8)!important}.sw-9{background:var(--c9)!important}.sw-10{background:var(--c10)!important}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 22px 26px;min-width:0;box-shadow:0 1px 0 var(--rule)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet-head h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance;min-width:0}
.sheet-head h1 .hl{padding:0 6px;border-radius:4px;color:var(--on-hl);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.meta{color:var(--ink-2);font-size:14px;margin:6px 0 0}
.meta b{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.danger.armed{background:var(--late);color:var(--sheet)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.controls{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;margin:18px 0 6px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.ctl-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:14px;color:var(--ink-2);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.view button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.day-h .d{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.day-h .r{font-size:13px;color:var(--ink-2)}
.day.late .day-h .d,.day.late .day-h .r{color:var(--late)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:start;gap:10px 12px;padding:10px 4px;border-top:1px dashed var(--rule)}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.stamp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink-2);color:var(--ink-2);border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap;font-weight:500}
.stamp.test,.stamp.quiz{border-color:var(--late);color:var(--late)}
.stamp.project{border-color:var(--accent-2);color:var(--accent-2)}
.stamp.homework{border-color:var(--accent);color:var(--accent)}
.body{min-width:0}
.ttl{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink-2);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px}
.tag i{width:9px;height:9px;border-radius:3px;display:inline-block}
.notes{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .ttl{color:var(--done);text-decoration:line-through}
.item.done .stamp{opacity:.5}
.ex{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:6px}

/* calendar */
.calnav{display:flex;align-items:center;gap:6px}
.calnav h3{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0 6px;min-width:9.5ch;text-align:center}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;width:34px;height:34px;font-size:16px;font-weight:700;line-height:1}
.iconbtn:hover{border-color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-top:14px;border-radius:10px;overflow:hidden}
.dow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:6px 8px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper)}
.cell{min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 5px 6px;text-align:left;background:var(--sheet);display:flex;flex-direction:column;gap:3px;min-width:0;border-top:0;border-left:0;border-radius:0}
.cell:hover{background:var(--accent-soft)}
.cell.out{background:var(--paper)}
.cell.out .num{opacity:.45}
.cell.today .num{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font-family:var(--f-mono);font-size:12px;font-weight:500;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.chip{display:block;width:100%;border:0;border-radius:5px;padding:2px 6px;font-size:12px;line-height:1.35;text-align:left;color:var(--on-hl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.04em;margin-right:4px;opacity:.8}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.late{outline:2px solid var(--late);outline-offset:-2px}
.more{font-size:11px;color:var(--ink-2);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots i.test{box-shadow:0 0 0 1.5px var(--late)}
.dayview{margin-top:18px}

.empty{text-align:center;padding:44px 16px 20px;color:var(--ink-2)}
.empty.sm{padding:16px 8px 6px}
.empty h3{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:42ch}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:460px;padding:20px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .lbl{font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:8px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--sheet)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.types button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.modal-foot .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--late);font-size:13px;margin:-4px 0 10px}

/* quick add */
.quick{margin-top:16px;background:var(--accent-soft);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.quick-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.qlbl{font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);width:52px;flex:none}
.qtitle{flex:1;min-width:0;background:var(--sheet);border:1.5px solid var(--rule);border-radius:9px;padding:10px 12px;font-size:16px}
.qtitle:focus{border-color:var(--accent);outline:none}
.pill{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{border-color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pill i{width:10px;height:10px;border-radius:3px;display:inline-block}
.qdate{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;font-size:13px}
.quick .add{align-self:flex-start}
.newclass{display:flex;gap:6px;margin-top:6px}
.newclass input{flex:1;min-width:0;border:1.5px solid var(--accent);background:var(--sheet);border-radius:9px;padding:8px 10px}
.setup{max-width:480px;margin:10px auto 0;padding:24px 4px 8px}
.setup h3{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0 0 6px}
.setup p{color:var(--ink-2);margin:0 0 14px}
.setup .newclass input{font-size:16px;padding:11px 12px}
.hint{font-size:13px;color:var(--ink-2);margin:2px 0 0}

/* study tracker */
.tab.study .sw{background:var(--accent-2)}
.panel{margin-top:18px}
.panel-h{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-h small{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--ink-2)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--accent);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:700;max-width:100%}
.tchip span{overflow-wrap:anywhere}
.tchip button{border:0;background:var(--accent-soft);color:var(--ink);border-radius:50%;width:22px;height:22px;line-height:1;font-size:14px;flex:none}
.sugg .pill{border-style:dashed}
.preview{font-size:14px;color:var(--ink-2);margin:0}
.preview b{color:var(--ink)}
.daysnum{width:70px;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;font-size:13px}
.plans{display:grid;gap:14px}
.plan{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.plan h3{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.plan h3 i{width:12px;height:12px;border-radius:3px;flex:none}
.plan .when{font-size:14px;color:var(--ink-2);margin:2px 0 0}
.plan .when b{color:var(--late)}
.bar{height:8px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.barlbl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sess{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px dashed var(--rule)}
.sess:first-of-type{margin-top:8px}
.sess .sd{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.sess .sd small{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-2)}
.sess.today .sd{color:var(--accent);font-weight:700}
.sess.past .sd{color:var(--done)}
.stasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stask{display:flex;align-items:flex-start;gap:10px;min-width:0}
.stask input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.stask label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.stask.done label{color:var(--done);text-decoration:line-through}
.stask .x{border:0;background:transparent;color:var(--ink-2);font-size:15px;padding:0 4px;opacity:.6}
.stask .x:hover{opacity:1;color:var(--late)}
.sadd{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:700;padding:2px 0;text-align:left}
.sadd-in{display:flex;gap:6px}
.sadd-in input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:8px;padding:5px 8px;background:var(--sheet)}
.studyday{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:16px}
.studyday .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);margin:0 0 6px}
.studyday .for{font-size:12px;color:var(--ink-2)}
.chip.study{background:var(--sheet)!important;color:var(--ink);border:1px dashed var(--accent-2);font-weight:400}
.chip.study b{color:var(--accent-2)}
.dots i.study{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.finished summary{cursor:pointer;color:var(--ink-2);font-size:14px;margin-top:16px}

.pages{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:0 0 18px;overflow-x:auto}
.pages button{border:0;background:transparent;padding:10px 14px 11px;font-weight:700;font-size:15px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.pages button:hover{color:var(--ink)}
.pages button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.pages .badge{font-family:var(--f-mono);font-size:11px;background:var(--imp);color:var(--ink);border:1px solid var(--imp-edge);border-radius:999px;padding:0 7px;font-weight:500}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.solo .tabs{display:none}
.layout.solo .sheet{max-width:820px;width:100%;margin:0 auto}
.daystrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.dchip{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:52px}
.dchip b{font-size:15px}
.dchip small{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip[aria-pressed="true"] small{color:var(--accent-ink)}
.dchip .n{font-family:var(--f-mono);font-size:10px;color:var(--late);height:12px}
.dchip[aria-pressed="true"] .n{color:var(--accent-ink)}
.todo-add{display:flex;gap:8px;margin:14px 0 6px}
.todo-add input{flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;padding:10px 12px;font-size:15px}
.todo-add input:focus{border-color:var(--accent);outline:none}
.todos{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet)}
.todo.imp{background:var(--imp);border-color:var(--imp-edge)}
.todo input[type=checkbox]{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.todo .tt{font-weight:700;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;font-size:15px}
.todo .why{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--ink-2);margin-top:2px}
.todo.imp .why{color:var(--ink)}
.todo .flag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.todo .acts{display:flex;gap:2px;align-items:center}
.todo .acts button{border:0;background:transparent;font-size:16px;color:var(--ink-2);padding:0 4px;line-height:1}
.todo .acts button.on{color:var(--imp-edge)}
.todo.done{opacity:.6}
.todo.done .tt{text-decoration:line-through}
.todo-legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:6px 0 0}
.todo-legend i{width:14px;height:14px;border-radius:4px;background:var(--imp);border:1px solid var(--imp-edge)}
.subh{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 0}

.chip.sw-7,.chip.sw-8,.chip.sw-9,.chip.sw-10,.hl.sw-8,.hl.sw-9,.hl.sw-10{color:#fff!important}
.toast-act{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:5px 12px;font-weight:800;margin-left:12px;cursor:pointer}
.toast{position:fixed;display:flex;width:max-content;z-index:80!important;align-items:center;gap:4px;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .tabs{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:6px}
  .tabs h2{display:none}
  .tab,.addclass{width:auto;flex:none;white-space:nowrap;margin-top:0;background:var(--sheet);border-color:var(--rule)}
  .tab .nm{max-width:16ch}
  .sheet{padding:16px 12px 22px}
  .sheet-head h1{font-size:25px}
  .row2{grid-template-columns:1fr}
  .cell{min-height:56px;padding:3px;align-items:center}
  .chip,.more{display:none}
  .dots{display:flex;justify-content:center}
  .dow{padding:5px 2px;text-align:center;font-size:10px;letter-spacing:.04em}
  .calnav h3{font-size:17px;min-width:0}
  .qlbl{width:100%}
  .sess{grid-template-columns:minmax(0,1fr)}
}
/* ---- friendly redesign overrides ---- */
.top{align-items:center;margin-bottom:14px}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:32px;letter-spacing:0;color:var(--ink)}
.brand input{font-family:var(--f-display);font-weight:700}
.hdr-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.today-lbl,.qlbl,.quick-h,.day-h .d,.stamp,.dow,.flag,.subh,.field label,.field .lbl,.tabs h2,.sess .sd,.barlbl,.studyday .lbl,.dchip small,.num,.time,.tab .ct,.chip b,.ex{
  text-transform:none!important;letter-spacing:0!important;font-family:var(--f-body)!important}
.today-lbl{font-size:15px;font-weight:700;color:var(--ink-2)}
.palette{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:700}
.palette button{width:24px;height:24px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 1px var(--rule);padding:0}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pages{border:0;background:var(--sheet);border-radius:999px;padding:5px;box-shadow:var(--shadow);display:flex;gap:4px;width:max-content;max-width:100%;margin:0 0 20px}
.pages button{border:0;border-radius:999px;padding:9px 18px;margin:0;font-size:15px;font-weight:800}
.pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.pages .badge{background:#f3e6ae!important;color:#4a4020!important;border-color:#dcc77c!important}
.todo .flag{font-weight:800;font-size:12px}
.sheet{border:0;border-radius:22px;box-shadow:var(--shadow);padding:26px 28px 30px}
.sheet-head h1{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:0}
.lead{font-size:16px;color:var(--ink-2);margin:4px 0 0;max-width:60ch}
.tabs{background:var(--sheet);border-radius:18px;padding:14px 10px;box-shadow:var(--shadow)}
.tabs h2{font-size:14px!important;font-weight:800;color:var(--ink);margin:0 0 6px 8px}
.tab{border-radius:12px}
.tab[aria-current="true"]{background:var(--accent-soft);border-color:transparent}
.addclass{border-radius:12px}
.btn{border-radius:12px;font-weight:800}
.btn.primary{box-shadow:0 2px 0 color-mix(in srgb, var(--accent) 75%, #000 25%)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.stamp{border-radius:999px;font-size:12px;font-weight:800;padding:1px 9px}
.quick{background:var(--accent-soft);border:0;border-radius:18px;padding:18px}
.quick-h{font-size:17px!important;font-weight:800;color:var(--ink)!important}
.qform{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.qf{display:flex;flex-direction:column;gap:4px;min-width:0}
.qf span{font-size:13px;font-weight:700;color:var(--ink-2)}
.qf input,.qf select{background:var(--sheet);border:2px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0;font-size:15px}
.qf input:focus,.qf select:focus{border-color:var(--accent);outline:none}
.qshort{display:flex;gap:6px;flex-wrap:wrap}
.qshort button{border:0;background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.qshort button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;align-items:start}
.step .no{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.step h4{margin:3px 0 8px;font-size:16px;font-weight:800}
.stepper{display:inline-flex;align-items:center;background:var(--sheet);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:transparent;width:42px;height:42px;font-size:20px;font-weight:800;color:var(--accent)}
.stepper output{min-width:96px;text-align:center;font-weight:800}
.todo{border-radius:14px}
.todo.imp{border-width:2px}
.dchip{border-radius:14px}
.plan{border-radius:16px}
.cal{border-radius:14px}
.empty h3{font-family:var(--f-display);font-weight:700}
@media (max-width:760px){
  .qform{grid-template-columns:1fr 1fr}
  .qform .qf:first-child{grid-column:1/-1}
  .qform .btn{grid-column:1/-1}
  .sheet{padding:18px 14px 22px;border-radius:18px}
  .sheet-head h1{font-size:28px}
  .pages{width:100%}
  .pages button{flex:1;padding:9px 4px;font-size:13px}
}
.modal.wide{max-width:760px}
.drop{border:2px dashed var(--rule);border-radius:16px;padding:26px 16px;text-align:center;color:var(--ink-2);background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:block;margin:12px auto 0;max-width:100%}
.found{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto}
.found li{display:grid;grid-template-columns:auto minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:center;background:var(--paper);border-radius:12px;padding:8px 10px}
.found li.off{opacity:.45}
.found input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.found input,.found select{background:var(--sheet);border:1px solid var(--rule);border-radius:9px;padding:7px 8px;min-width:0;width:100%;font-size:14px}
.found .nt{grid-column:2/-1;font-size:12px;color:var(--ink-2);margin-top:-4px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--accent);vertical-align:-3px;margin-right:8px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
/* settings */
.set-sec{border-top:1px solid var(--rule);padding:18px 0 4px}
.set-sec:first-of-type{border-top:0}
.set-sec h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0 0 4px}
.set-sec .lead{margin:0 0 12px;font-size:15px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 0}
.set-row > span{font-weight:700}
.set-row small{display:block;font-weight:400;color:var(--ink-2);font-size:13px}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--rule);background:var(--sheet);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;min-width:86px}
.themes button i{width:34px;height:34px;border-radius:50%;display:block}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.set-in{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--rule);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
/* events */
.chip.ev{background:var(--sheet)!important;color:var(--ink)!important;border:1px solid var(--accent);font-weight:700}
.chip.ev b{color:var(--accent)}
.dots i.ev{background:var(--accent)!important;border-radius:2px}
.evlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.evrow{display:grid;grid-template-columns:72px auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet)}
.evrow .tm{font-weight:800;font-size:14px;color:var(--accent);padding-top:1px;font-variant-numeric:tabular-nums}
.evrow .kd{font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;border:1.5px solid var(--accent);color:var(--accent);white-space:nowrap;margin-top:1px}
.evrow .tt{font-weight:700;background:none;border:0;padding:0;text-align:left;font-size:15px;overflow-wrap:anywhere}
.evrow .sub{font-size:13px;color:var(--ink-2)}
.evrow .gcal{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.evrow.done .tt{text-decoration:line-through;color:var(--done)}
.evrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0}
.sched-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 0}
.sched-h h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
@media (max-width:760px){.evrow{grid-template-columns:auto minmax(0,1fr) auto} .evrow .kd{display:none} .themes button{min-width:0;flex:1;padding:8px 2px;font-size:11px;gap:4px} .themes button i{width:28px;height:28px}}
@media (max-width:760px){.found li{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)} .found li .ti{grid-column:2/-1}}

/* login screen */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-card{background:var(--sheet);border-radius:24px;box-shadow:var(--shadow);padding:30px 28px;width:100%;max-width:400px}
.login-card h1{font-family:var(--f-display);font-weight:600;font-size:34px;margin:0}
.login-card .lead{margin:4px 0 18px}
.login-card .qf{margin-bottom:12px}
.login-card .qf input{background:var(--paper);font-size:17px}
.pin{letter-spacing:.5em;font-size:22px!important;text-align:center}
.login-switch{display:flex;background:var(--paper);border-radius:12px;padding:4px;margin-bottom:16px}
.login-switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:800;color:var(--ink-2)}
.login-switch button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700;font-size:14px;color:var(--ink-2)}
.who button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.fine{font-size:12px;color:var(--ink-2);margin:14px 0 0;line-height:1.45}
</style>
</head>
<body>
<div id="loginRoot"></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="hdr-r"><span class="today-lbl" id="todayLbl"></span><div class="palette" id="palette"></div><div class="who" id="who"></div></div>
  </header>
  <nav class="pages" id="pages" aria-label="Pages"></nav>
  <div id="banner"></div>
  <div class="layout" id="layout">
    <nav class="tabs" id="tabs" aria-label="Classes"></nav>
    <main class="sheet" id="sheet"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
const TYPES = [['homework','Homework'],['test','Test'],['quiz','Quiz'],['project','Project'],['reading','Reading'],['other','Other']];
const TYPE_LABEL = Object.fromEntries(TYPES);
const TYPE_SHORT = {homework:'HW',test:'TEST',quiz:'QUIZ',project:'PROJ',reading:'READ',other:''};
const TYPE_RANK = {test:0,quiz:1,project:2,homework:3,reading:4,other:5};
const COLORS = Array.from({length:10},(_,i)=>[String(i+1),`Shade ${i+1}`]);
const SPREAD = ['1','6','3','8','5','10','2','7','4','9'];   // hand out shades far apart so classes look different
const nextColor = () => { const used = new Set(state.classes.map(c=>c.color)); return SPREAD.find(k=>!used.has(k)) || SPREAD[state.classes.length % 10]; };
const DEFAULT_TITLE = 'My Planner';

const state = {
  classes:[], items:[], sel:'all', view:'list', range:'week', showDone:false,
  calMonth:null, calDay:null, title:DEFAULT_TITLE, renaming:false,
  mode:'loading', readOnly:false, slow:false, loaded:false,
  addingClass:false, newClass:'',
  q:{title:'', type:'homework', classId:null, date:null},
  palette:'berry', page:'today', events:[], prefs:{mode:'auto', start:'today', notifyOn:false, daily:'07:30', before:30, icon:'a'}, todos:[], todoDay:null, todoText:'',
  plans:[], planAdd:null, planAddText:'', delArm:null,
  sp:{pick:null, classId:null, title:'', type:'test', date:null, days:3, tasks:[], taskText:''}
};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d||1); };
const todayIso = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = s => Math.round((parse(s) - parse(todayIso())) / 864e5);
const rel = n => n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>1?`in ${n} days`:`${-n} days ago`;
const dayLabel = s => parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const longDay = s => parse(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const fmtTime = t => { if(!t) return ''; const [h,m]=t.split(':').map(Number); const d=new Date(); d.setHours(h,m); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
function rangeBounds(r){
  const d = parse(todayIso());
  const t = iso(d);
  if(r==='week') return [t, addDays(t,6)];
  if(r==='month') return [t, addDays(t,30)];
  return ['0000-01-01','9999-12-31'];
}

/* ---------- DOM helper ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='text') el.textContent=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}
function toast(msg, action){
  const root = document.getElementById('toastRoot');
  const btn = action ? h('button',{class:'toast-act',onclick:()=>{ root.replaceChildren(); clearTimeout(toast.t); action.run(); }}, action.label) : null;
  root.replaceChildren(h('div',{class:'toast',role:'status'}, h('span',{text:msg}), btn));
  clearTimeout(toast.t); toast.t = setTimeout(()=>root.replaceChildren(), action ? 6000 : 3200);
}
// Checking something off shows "Done" with an Undo button for 6 seconds.
function checked(label, done, undo){
  if(done) toast(`Checked off: ${label}`, {label:'Undo', run: async()=>{ await undo(); toast('Undone'); }});
}

/* ---------- storage ---------- */
let refs = null;
const uidGen = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
async function write(fn){
  if(state.readOnly){ toast('This planner is read-only for you.'); return false; }
  try { await fn(); return true; }
  catch(e){
    const code = e && e.code;
    if(code==='invalid_argument'){ state.readOnly=true; render(); toast('Your changes could not be saved. Ask the planner owner for Contributor access.'); }
    else if(code==='quota_exceeded'){ toast('Storage is full. Delete some old assignments, then try again.'); }
    else if(code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await fn(); return true; }catch{ toast('Could not reach the server. Try again in a moment.'); } }
    else toast('Something went wrong saving that. Try again.');
    return false;
  }
}
const store = {
  async add(kind, data){ const id = uidGen(); state[kind].push({id,...data}); persist(); render(); return id; },
  async update(kind, id, data){ const x = state[kind].find(o=>o.id===id); if(x) Object.assign(x,data); persist(); render(); return true; },
  async remove(kind, id){ state[kind] = state[kind].filter(o=>o.id!==id); persist(); render(); return true; },
  async setTitle(t){ state.title=t; return store.saveMeta(); },
  async saveMeta(){ persist(); render(); return true; }
};

/* =====================================================================
   SAVING
   By default each planner is saved in the browser it was made in.
   To let people log in from ANY device, create a free Firebase project
   (console.firebase.google.com → Add project → Build → Firestore Database
   → Create database), then Project settings → Your apps → Web app, and
   paste the config object here instead of null, e.g.
   const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." };
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAA5xwvFXie7sCwz0jQ6SrplBg_D2P0AH0",
  authDomain: "my-planner-dd9aa.firebaseapp.com",
  projectId: "my-planner-dd9aa",
  storageBucket: "my-planner-dd9aa.firebasestorage.app",
  messagingSenderId: "1021488623682",
  appId: "1:1021488623682:web:1d8fa04dc823c3eb2f3ddb"
};
const PRELOADED = {};

// Talk to Firestore over its plain web address (no extra libraries, clear errors).
class CloudError extends Error { constructor(kind, detail){ super(kind); this.kind = kind; this.detail = detail; } }
const DB_NAMES = ['default', '(default)'];   // Eva's Firestore database is named "default"
let dbName = DB_NAMES[0];
const cloudUrl = keyAndMask => { const [key, mask] = keyAndMask.split('?mask='); return `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/${encodeURIComponent(dbName)}/documents/planners/${key}?key=${FIREBASE_CONFIG.apiKey}` + (mask ? `&updateMask.fieldPaths=${mask}` : ''); };
async function cloudCall(key, opts={}){
  try { return await cloudCallOnce(key, opts); }
  catch(e){
    if(e.kind!=='nodb') throw e;
    for(const n of DB_NAMES){ if(n===dbName) continue; const prev=dbName; dbName=n; try { return await cloudCallOnce(key, opts); } catch(e2){ if(e2.kind!=='nodb') throw e2; dbName=prev; } }
    throw e;
  }
}
async function cloudCallOnce(key, opts={}){
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 12000);
  let res;
  try { res = await fetch(cloudUrl(key), {...opts, signal: ctl.signal}); }
  catch(e){ throw new CloudError(e && e.name==='AbortError' ? 'timeout' : 'blocked', String(e)); }
  finally { clearTimeout(timer); }
  let body = null; try { body = await res.json(); } catch {}
  if(res.ok) return body;
  const msg = (body && body.error && body.error.message) || '';
  if(res.status===404 && /database\b.*does not exist/i.test(msg)) throw new CloudError('nodb', msg);
  if(res.status===404) return null;                       // no planner with that name + passcode
  if(res.status===403 || res.status===401) throw new CloudError(/api.*(disabled|not been used)/i.test(msg) ? 'api' : 'rules', msg);
  throw new CloudError('server', res.status+' '+msg);
}
const cloudGet = async key => { const d = await cloudCall(key); return d && d.fields && d.fields.json ? JSON.parse(d.fields.json.stringValue) : null; };
const cloudSet = (key, data, full) => cloudCall(key + (full ? '' : '?mask=json'), {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(data)}}})});
// this device's push subscription lives in its own field ("push") so planner saves don't erase it
async function cloudPush(key, update){
  const d = await cloudCall(key);
  let push = {subs:[]}; try { if(d && d.fields && d.fields.push) push = JSON.parse(d.fields.push.stringValue); } catch {}
  push = update(push) || push;
  await cloudCall(key + '?mask=push', {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:{push:{stringValue: JSON.stringify(push)}}})});
}
function cloudMessage(e){
  const k = e && e.kind;
  if(k==='timeout' || k==='blocked') return 'Can’t reach the planner’s database. If you’re on a school device or school Wi-Fi, it may be blocked. Try another device or network.';
  if(k==='nodb') return 'The planner’s database isn’t set up yet (Firestore database missing).';
  if(k==='rules') return 'The planner’s database said no (check the Firestore rules were published).';
  if(k==='api') return 'The planner’s database is turned off (Firestore API not enabled).';
  return 'Something went wrong talking to the database. Try again in a minute.';
}
async function keyFor(name, pin){
  const txt = 'planner:' + name.trim().toLowerCase().replace(/\s+/g,' ') + ':' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  } catch {
    let h1=0x811c9dc5, h2=0x12345; for(const ch of txt){ h1=Math.imul(h1^ch.charCodeAt(0),16777619)>>>0; h2=Math.imul(h2+ch.charCodeAt(0),2654435761)>>>0; }
    return h1.toString(16)+h2.toString(16);
  }
}
const LS = { get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); return true; }catch{ return false; } }, del(k){ try{ localStorage.removeItem(k); }catch{} } };
const snapshotData = () => ({ name: state.user.name, title: state.title, theme: state.palette, prefs: state.prefs,
  classes: state.classes, items: state.items, plans: state.plans, todos: state.todos, events: state.events, updated: Date.now() });
let saveTimer = null;
function persist(){
  if(!state.user) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const data = snapshotData();
    LS.set('planner:'+state.user.key, JSON.stringify(data));
    if(FIREBASE_CONFIG){ try { await cloudSet(state.user.key, data); } catch(e){ toast('Not saved online: '+cloudMessage(e)); } }
  }, 300);
}
async function loadPlanner(key){
  if(FIREBASE_CONFIG){ const d = await cloudGet(key); return d && d.deleted ? null : d; }   // throws a CloudError if the database can't be used
  const raw = LS.get('planner:'+key);
  if(raw) return JSON.parse(raw);
  return PRELOADED[key] ? JSON.parse(JSON.stringify(PRELOADED[key])) : null;
}
function useData(d, name, key){
  state.user = {name: d.name || name, key};
  state.title = d.title || DEFAULT_TITLE; state.palette = d.theme || 'berry';
  state.classes = d.classes||[]; state.items = d.items||[]; state.plans = d.plans||[]; state.todos = d.todos||[]; state.events = d.events||[];
  state.prefs = {mode:'auto', start:'today', notifyOn:false, daily:'07:30', before:30, icon:'a', ...(d.prefs||{})};
  state.loaded = true; state.mode = 'local'; state.page = state.prefs.start || 'today';
  applyPalette(); applyMode();
}

function startApp(){
  document.getElementById('loginRoot').replaceChildren();
  document.getElementById('app').hidden = false;
  const pg = location.hash.slice(1); if(['today','calendar','planner','study','settings'].includes(pg)) state.page = pg;
  if(state.prefs.notifyOn && notifSupported() && Notification.permission==='granted') enablePush(true).catch(()=>{});
  render();
}
function logout(){
  LS.del('planner:session');
  state.user=null; state.classes=[]; state.items=[]; state.plans=[]; state.todos=[]; state.events=[];
  delete document.documentElement.dataset.theme; delete document.documentElement.dataset.palette; applyIcon();
  document.getElementById('app').hidden = true; showLogin('login');
}
function showLogin(mode){
  const root = document.getElementById('loginRoot');
  let msg = '';
  const draw = () => {
    const name = h('input',{id:'lgName',maxlength:'40',autocomplete:'username',placeholder:'e.g. Eva'});
    const pin = h('input',{id:'lgPin',class:'pin',inputmode:'numeric',pattern:'[0-9]*',maxlength:'4',autocomplete: mode==='new'?'new-password':'current-password',placeholder:'••••',type:'password'});
    const pin2 = mode==='new' ? h('input',{id:'lgPin2',class:'pin',inputmode:'numeric',pattern:'[0-9]*',maxlength:'4',autocomplete:'new-password',placeholder:'••••',type:'password'}) : null;
    const err = h('p',{class:'err',style:'margin:0 0 10px'}, msg); err.hidden = !msg;
    const go = async e => {
      e.preventDefault();
      const n = name.value.trim(), p = pin.value.trim();
      const fail = t => { msg = t; err.textContent = t; err.hidden = false; };
      if(!n) return fail('Type your name.');
      if(!/^\d{4}$/.test(p)) return fail('Your passcode is 4 numbers.');
      if(mode==='new' && pin2.value.trim()!==p) return fail('The two passcodes don’t match.');
      btn.disabled = true;
      const key = await keyFor(n,p);
      let found = null;
      btn.textContent = 'Opening…';
      try { found = await loadPlanner(key); } catch(e) { btn.disabled=false; btn.textContent = mode==='new'?'Create my planner':'Open my planner'; return fail(FIREBASE_CONFIG ? cloudMessage(e) : 'Couldn’t open your planner. Try again.'); }
      if(mode==='new'){
        if(found){ btn.disabled=false; return fail('There’s already a planner with that name and passcode. Log in instead, or pick a different passcode.'); }
        useData({name:n}, n, key);
        if(FIREBASE_CONFIG){ try { await cloudSet(key, snapshotData()); } catch(e){ btn.disabled=false; btn.textContent='Create my planner'; state.user=null; return fail(cloudMessage(e)); } }
        persist();
      } else {
        if(!found){ btn.disabled=false; btn.textContent='Open my planner'; return fail('No planner with that name and passcode yet. Check them, or tap “New planner” to make one.'); }
        useData(found, n, key);
      }
      LS.set('planner:session', JSON.stringify({key, name: state.user.name}));
      startApp();
    };
    const btn = h('button',{class:'btn primary',type:'submit',style:'width:100%;height:46px;font-size:16px'}, mode==='new'?'Create my planner':'Open my planner');
    root.replaceChildren(h('div',{class:'login'}, h('form',{class:'login-card',onsubmit:go},
      h('h1',null,'My Planner'),
      h('p',{class:'lead'}, mode==='new' ? 'Make your own planner. Just pick your name and a 4-number passcode.' : 'Homework, tests, study plans and a daily to-do list.'),
      h('div',{class:'login-switch'},
        h('button',{type:'button','aria-pressed':String(mode==='login'),onclick:()=>{mode='login';msg='';draw();}},'Log in'),
        h('button',{type:'button','aria-pressed':String(mode==='new'),onclick:()=>{mode='new';msg='';draw();}},'New planner')),
      h('label',{class:'qf'}, h('span',null,'Your name'), name),
      h('label',{class:'qf'}, h('span',null, mode==='new'?'Pick a 4-number passcode':'Your 4-number passcode'), pin),
      pin2 ? h('label',{class:'qf'}, h('span',null,'Type the passcode again'), pin2) : null,
      err, btn,
      h('p',{class:'fine'}, FIREBASE_CONFIG
        ? 'You can log in from any phone or computer with the same name and passcode. A 4-number passcode is easy to guess, so don’t put private information in your planner.'
        : 'Your planner is saved in this browser, on this device. Use the same device and browser to come back to it. A 4-number passcode is easy to guess, so don’t put private information in your planner.'))));
    setTimeout(()=>name.focus(),30);
  };
  draw();
}

window.addEventListener('hashchange', ()=>{ const pg = location.hash.slice(1); if(state.user && ['today','calendar','planner','study','settings'].includes(pg)) goPage(pg); });
async function init(){
  const t = todayIso(); state.calMonth = t.slice(0,7); state.calDay = t; state.q.date = t;
  document.getElementById('todayLbl').textContent = longDay(t);
  const sess = LS.get('planner:session');
  if(sess){
    try {
      const {key, name} = JSON.parse(sess);
      const d = await loadPlanner(key);
      if(d){ useData(d, name, key); startApp(); return; }
    } catch {}
  }
  showLogin('login');
}

/* ---------- derived ---------- */
const classById = id => state.classes.find(c=>c.id===id);
const sortedClasses = () => [...state.classes].sort((a,b)=>(a.created||0)-(b.created||0) || String(a.name).localeCompare(b.name));
const itemsFor = sel => state.items.filter(i => sel==='all' ? classById(i.classId) : i.classId===sel);
const byDue = (a,b) => a.due.localeCompare(b.due) || (a.time||'99').localeCompare(b.time||'99') || (TYPE_RANK[a.type]??9)-(TYPE_RANK[b.type]??9);

/* ---------- render ---------- */
function render(){
  // keep typing focus across live re-renders
  const a = document.activeElement, fid = a && a.id && a.tagName==='INPUT' ? a.id : null;
  let s0=null, s1=null; try{ s0=a.selectionStart; s1=a.selectionEnd; }catch{}
  customColorCss(state.classes.map(c=>c.color)); if(!state.renaming) renderBrand(); renderPalette(); renderWho(); renderPages(); renderBanner(); renderTabs(); renderSheet();
  if(fid){ const n=document.getElementById(fid); if(n && n!==document.activeElement){ n.focus(); try{ if(s0!=null) n.setSelectionRange(s0,s1); }catch{} } }
}

async function addClassNamed(raw){
  const nm = raw.trim(); if(!nm) return false;
  if(state.classes.some(c=>c.name.toLowerCase()===nm.toLowerCase())){ toast(`You already have ${nm}`); return false; }
  const used = state.classes.map(c=>c.color);
  const color = nextColor();
  const ok = await store.add('classes',{name:nm, color, teacher:'', created:Date.now()});
  if(ok) toast(`Added ${nm}`);
  return ok;
}
function classInput(id, placeholder){
  const inp = h('input',{id, maxlength:'60', placeholder, value:state.newClass, autocomplete:'off',
    oninput:e=>{ state.newClass=e.target.value; },
    onkeydown:async e=>{
      if(e.key==='Enter'){ e.preventDefault(); const v=state.newClass; state.newClass=''; e.target.value=''; if(!(await addClassNamed(v))){ state.newClass=v; } render(); }
      if(e.key==='Escape'){ state.addingClass=false; state.newClass=''; render(); }
    }});
  const btn = h('button',{class:'btn primary',type:'button',onclick:async()=>{ const v=state.newClass; state.newClass=''; await addClassNamed(v); render(); document.getElementById(id)?.focus(); }},'Add');
  return h('div',{class:'newclass'}, inp, btn);
}

function renderBrand(){
  const b = document.getElementById('brand');
  if(state.renaming){
    const inp = h('input',{id:'titleInput',maxlength:'40','aria-label':'Planner name',value:state.title});
    const finish = async save => {
      if(!state.renaming) return; state.renaming=false;
      const v = inp.value.trim();
      if(save && v && v!==state.title){ state.title=v; await store.setTitle(v); }
      renderBrand();
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();finish(true);} if(e.key==='Escape') finish(false); });
    inp.addEventListener('blur',()=>finish(true));
    b.replaceChildren(inp); inp.focus(); inp.select();
    return;
  }
  b.replaceChildren(
    h('p',{class:'brand-name',text:state.title}),
    h('button',{class:'rename',title:'Rename planner',onclick:()=>{state.renaming=true;renderBrand();}},'Rename'));
}

function renderBanner(){
  const b = document.getElementById('banner'); b.replaceChildren();
  if(false) b.append(h('div',{class:'banner'},
    h('b',null,'Example planner. '),'Nothing here is saved. Open this page while signed in to claude.ai to start your own planner; each person who opens it gets their own private classes.'));
  if(state.readOnly) b.append(h('div',{class:'banner warn'},'You can look around, but your changes won’t save. Ask the person who shared this planner to give you Contributor access.'));
  if(state.slow) b.append(h('div',{class:'banner warn'},'Your planner is taking a while to load. Check your connection; it will fill in once it’s reachable.'));
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  const t = todayIso();
  const counts = id => { const its = itemsFor(id).filter(i=>!i.done); return {open: its.filter(i=>i.due>=t).length, late: its.filter(i=>i.due<t).length}; };
  const tab = (id,label,color) => {
    const c = counts(id);
    return h('button',{class:'tab','aria-current':String(state.sel===id),onclick:()=>{state.sel=id;render();}},
      h('span',{class:'sw'+(color?` sw-${color}`:'')}),
      h('span',{class:'nm',text:label}),
      c.late ? h('span',{class:'ct late',title:`${c.late} past due`,text:`${c.late}!`}) : (c.open? h('span',{class:'ct',text:c.open}) : null));
  };
  nav.replaceChildren(
    h('h2',null,'Classes'),
    tab('all','All classes',null),
    ...sortedClasses().map(c=>tab(c.id,c.name,c.color)),
    ...(state.addingClass && state.classes.length
      ? [classInput('newClassSide','Class name, then Enter'), h('p',{class:'hint'},'Add as many as you like. Press Esc when done.')]
      : [h('button',{class:'addclass',onclick:()=>{state.addingClass=true; render(); document.getElementById('newClassSide')?.focus();}},'+ Add class')]));
}

function quickAdd(cls){
  const q = state.q, t = todayIso();
  if(cls) q.classId = cls.id;
  if(!q.classId || !classById(q.classId)) q.classId = (sortedClasses()[0]||{}).id || null;
  if(!q.date) q.date = t;

  const submit = async () => {
    const title = q.title.trim();
    if(!title){ toast('Type what the assignment is first.'); document.getElementById('qTitle')?.focus(); return; }
    if(!q.classId){ toast('Add a class first.'); return; }
    const data = {type:q.type, title, classId:q.classId, due:q.date, time:'', notes:'', done:false, created:Date.now()};
    const ok = await store.add('items', data);
    if(ok){
      q.title=''; const n=document.getElementById('qTitle'); if(n){ n.value=''; n.focus(); }
      const c = classById(data.classId);
      toast(`Added to ${c?c.name:'your list'}, due ${dayLabel(data.due)}`);
      render();
    }
  };
  const field = (label, ctl) => h('label',{class:'qf'}, h('span',null,label), ctl);
  const title = h('input',{id:'qTitle',maxlength:'140',autocomplete:'off',placeholder:'e.g. Chapter 5 worksheet',value:q.title,
    oninput:e=>{ q.title=e.target.value; }, onkeydown:e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }});
  const clsSel = h('select',{id:'qClass',onchange:e=>{q.classId=e.target.value;}},
    ...sortedClasses().map(c=>h('option',{value:c.id,selected:q.classId===c.id||null},c.name)));
  const typeSel = h('select',{id:'qType',onchange:e=>{q.type=e.target.value;}},
    ...TYPES.map(([k,l])=>h('option',{value:k,selected:q.type===k||null},l)));
  const date = h('input',{id:'qDate',type:'date',value:q.date,onchange:e=>{ if(e.target.value){ q.date=e.target.value; render(); } }});
  const shortcuts = h('div',{class:'qshort'},
    ...[[0,'Today'],[1,'Tomorrow'],[2,null],[3,null],[7,'Next week']].map(([n,l])=>{ const ds=addDays(t,n);
      return h('button',{type:'button','aria-pressed':String(q.date===ds),onclick:()=>{q.date=ds;render();}}, l || parse(ds).toLocaleDateString(undefined,{weekday:'long'})); }));
  return h('section',{class:'quick','aria-label':'Add homework or a test'},
    h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px'},
      h('p',{class:'quick-h',style:'margin:0'}, cls ? `Add something for ${cls.name}` : 'Add homework or a test'),
      h('button',{class:'btn sm',type:'button',onclick:()=>openPdfModal(cls)},'Import from a PDF or list')),
    h('div',{class:'qform'},
      field('What is it?', title),
      cls ? null : field('Class', clsSel),
      field('Type', typeSel),
      field('Due', date),
      h('button',{class:'btn primary',type:'button',onclick:submit,style:'height:44px'},'Add')),
    h('div',{style:'margin-top:10px'}, shortcuts));
}

function renderSheet(){
  const sheet = document.getElementById('sheet');
  if(state.sel!=='all' && state.sel!=='study' && !classById(state.sel)) state.sel='all';
  const cls = (state.sel==='all'||state.sel==='study') ? null : classById(state.sel);

  if(state.mode==='loading' || (state.mode==='db' && !state.loaded && !state.classes.length)){
    sheet.replaceChildren(h('div',{class:'empty'},h('p',null,'Opening your planner…'))); return;
  }
  if(!state.classes.length && state.page!=='settings' && state.page!=='calendar'){
    sheet.replaceChildren(h('div',{class:'setup'},
      h('h3',null,'Step 1: add your classes'),
      h('p',null,'Type a class name and press Enter. You can add more anytime with “+ Add class” on the left.'),
      classInput('newClassMain','e.g. Biology')));
    return;
  }
  if(state.page==='settings'){ sheet.replaceChildren(...renderSettings()); return; }
  if(state.page==='calendar'){ sheet.replaceChildren(...renderCalendarPage()); return; }
  if(state.page==='study'){ sheet.replaceChildren(...renderStudy()); return; }
  if(state.page==='today'){ sheet.replaceChildren(...renderToday()); return; }

  const t = todayIso();
  const all = itemsFor(state.sel);
  const late = all.filter(i=>!i.done && i.due<t).sort(byDue);
  const [,we] = rangeBounds('week');
  const weekOpen = all.filter(i=>!i.done && i.due>=t && i.due<=we).length;
  const nextTest = all.filter(i=>!i.done && i.due>=t && (i.type==='test'||i.type==='quiz')).sort(byDue)[0];
  const meta = h('p',{class:'meta'},
    h('b',null,String(weekOpen)), weekOpen===1?' thing due in the next 7 days':' things due in the next 7 days',
    late.length ? [' · ', h('b',{style:'color:var(--late)'},String(late.length)), ' past due'] : null,
    nextTest ? [' · Next ', TYPE_LABEL[nextTest.type].toLowerCase(), ': ', h('b',null,nextTest.title), ` (${rel(diff(nextTest.due)).toLowerCase()})`] : null);

  const title = cls ? h('h1',null,h('span',{class:`hl sw-${cls.color}`,text:cls.name})) : h('h1',null,'All my classes');
  const head = h('div',{class:'sheet-head'},
    h('div',{style:'min-width:0'}, title, cls ? (cls.teacher ? h('p',{class:'meta',text:cls.teacher}) : null) : h('p',{class:'lead'},'Add homework and tests below. Pick a class on the left to see just that class.'), meta),
    h('div',{class:'actions'},
      cls ? h('button',{class:'btn',onclick:()=>openClassModal(cls)},'Edit class') : null));


  const viewSeg = h('div',{class:'seg view',role:'group','aria-label':'View'},
    ...[['list','List'],['calendar','Calendar']].map(([k,l]) =>
      h('button',{'aria-pressed':String(state.view===k),onclick:()=>{state.view=k;render();}},l)));
  const done = h('label',{class:'chk'}, h('input',{type:'checkbox',id:'showDone',checked:state.showDone||null,onchange:e=>{state.showDone=e.target.checked;render();}}),'Show completed');

  let leftCtl, body;
  if(state.view==='list'){
    leftCtl = h('div',{class:'seg',role:'group','aria-label':'Time range'},
      ...[['week','Next 7 days'],['month','Next 30 days'],['all','Everything']].map(([k,l]) =>
        h('button',{'aria-pressed':String(state.range===k),onclick:()=>{state.range=k;render();}},l)));
    body = renderList(all, late, cls);
  } else {
    leftCtl = calNav();
    body = renderCalendar(all, cls);
  }
  const controls = h('div',{class:'controls'}, h('div',{class:'ctl-l'}, viewSeg, leftCtl), done);
  sheet.replaceChildren(...[head, quickAdd(cls), controls].filter(Boolean), ...[].concat(body));
}

function renderList(all, late, cls){
  const t = todayIso();
  const [rs,re] = rangeBounds(state.range);
  const inRange = all.filter(i => i.due>=rs && i.due<=re && (state.showDone || !i.done) && !(!i.done && i.due<t)).sort(byDue);
  const groups = [];
  if(late.length) groups.push(dayGroup('Past due', `${late.length} not done`, late, true));
  const byDay = new Map(); inRange.forEach(i=>{ if(!byDay.has(i.due)) byDay.set(i.due,[]); byDay.get(i.due).push(i); });
  for(const [d,its] of byDay) groups.push(dayGroup(dayLabel(d), rel(diff(d)), its, false));
  if(groups.length) return groups;
  const label = state.range==='week'?'in the next 7 days':'in the next 30 days';
  return h('div',{class:'empty'},
    h('h3',null, state.range==='all' ? 'Nothing added yet' : `Nothing due ${label}`),
    h('p',null, 'Use the green box above to add a test, quiz or homework. Try “Everything” or the calendar to see later dates.'));
}

function calNav(){
  const m = parse(state.calMonth+'-01');
  const shift = n => { const d = new Date(m.getFullYear(), m.getMonth()+n, 1); state.calMonth = iso(d).slice(0,7); render(); };
  return h('div',{class:'calnav'},
    h('button',{class:'iconbtn','aria-label':'Previous month',onclick:()=>shift(-1)},'‹'),
    h('h3',{text:m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}),
    h('button',{class:'iconbtn','aria-label':'Next month',onclick:()=>shift(1)},'›'),
    h('button',{class:'btn sm',onclick:()=>{const t=todayIso(); state.calMonth=t.slice(0,7); state.calDay=t; render();}},'Today'));
}

function renderCalendar(all, cls, withEvents){
  const t = todayIso();
  const first = parse(state.calMonth+'-01');
  const start = new Date(first); start.setDate(1-first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  const end = new Date(start); end.setDate(start.getDate()+41);   // always 6 weeks, so the next days are visible at month end
  const visible = all.filter(i => state.showDone || !i.done);
  const byDay = new Map(); visible.forEach(i=>{ if(!byDay.has(i.due)) byDay.set(i.due,[]); byDay.get(i.due).push(i); });
  byDay.forEach(v=>v.sort(byDue));

  const cells = [];
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells.push(h('div',{class:'dow',text:d})));
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const ds = iso(d), its = byDay.get(ds)||[];
    const out = d.getMonth()!==first.getMonth();
    const cell = h('button',{class:'cell'+(out?' out':'')+(ds===t?' today':''),'aria-pressed':String(state.calDay===ds),
      'aria-label':`${longDay(ds)}, ${its.length} item${its.length===1?'':'s'}`,
      onclick:()=>{ state.calDay=ds; state.q.date=ds; if(out) state.calMonth=ds.slice(0,7); render(); }},
      h('span',{class:'num',text:d.getDate()}));
    its.slice(0,3).forEach(i=>{
      const c = classById(i.classId);
      const isLate = !i.done && i.due<t;
      cell.append(h('span',{class:`chip sw-${c?c.color:'1'}`+(i.done?' done':'')+(isLate?' late':''),title:`${TYPE_LABEL[i.type]}: ${i.title}`,
        role:'button',tabindex:'0',
        onclick:e=>{e.stopPropagation(); openItemModal(i);},
        onkeydown:e=>{ if(e.key==='Enter'){e.preventDefault();e.stopPropagation();openItemModal(i);} }},
        TYPE_SHORT[i.type] ? h('b',null,TYPE_SHORT[i.type]) : null, i.title));
    });
    const evs = withEvents ? eventsOn(ds) : [];
    evs.slice(0,2).forEach(ev=>cell.append(h('span',{class:'chip ev'+(ev.doneToday?' done':''),title:`${EV_LABEL[ev.kind]||'Event'}: ${ev.title}${ev.time?' at '+fmtTime(ev.time):''}`,role:'button',tabindex:'0',
      onclick:e=>{e.stopPropagation(); openEventModal(ev.src);}, onkeydown:e=>{ if(e.key==='Enter'){e.preventDefault();e.stopPropagation();openEventModal(ev.src);} }},
      h('b',null, ev.time ? fmtTime(ev.time).replace(/:00|\s/g,'').toLowerCase() : (EV_SHORT[ev.kind]||'')), ev.title)));
    const st = studyPlansOn(ds, cls);
    const room = Math.max(0, 3-Math.min(its.length,3)-Math.min(evs.length,2));
    st.slice(0,room).forEach(({plan,sess})=>{
      const left = sess.tasks.filter(x=>!x.done).length;
      cell.append(h('span',{class:'chip study'+(left?'':' done'),title:`Study for ${plan.title}`,role:'button',tabindex:'0',
        onclick:e=>{e.stopPropagation(); state.page='study'; render(); window.scrollTo(0,0);},
        onkeydown:e=>{ if(e.key==='Enter'){e.preventDefault();e.stopPropagation();state.page='study';render();} }},
        h('b',null,'STUDY'), plan.title));
    });
    const hidden = Math.max(0,its.length-3) + Math.max(0, st.length-room) + Math.max(0, evs.length-2);
    if(hidden) cell.append(h('span',{class:'more',text:`+${hidden} more`}));
    if(its.length||st.length||evs.length) cell.append(h('span',{class:'dots'}, ...evs.slice(0,2).map(()=>h('i',{class:'ev'})),
      ...its.slice(0,4).map(i=>{const c=classById(i.classId); return h('i',{class:`sw-${c?c.color:'1'}`+((i.type==='test'||i.type==='quiz')?' test':'')});}),
      ...st.slice(0,2).map(()=>h('i',{class:'study'}))));
    cells.push(cell);
  }

  const sel = state.calDay;
  const selItems = (byDay.get(sel)||[]);
  const dayview = h('section',{class:'dayview'},
    h('div',{class:'day-h'}, h('span',{class:'d',text:dayLabel(sel)}), h('span',{class:'r',text:rel(diff(sel))}),
      withEvents ? null
        : h('button',{class:'btn sm',style:'margin-left:auto',onclick:()=>{ state.q.date=sel; render(); const n=document.getElementById('qTitle'); if(n){ n.scrollIntoView({block:'center'}); n.focus(); } }},'+ Add on this day')),
    withEvents ? scheduleBlock(sel, false) : null,
    selItems.length ? h('ul',{class:'list'}, ...selItems.map(i=>itemRow(i,false)))
      : (withEvents && eventsOn(sel).length ? null : h('div',{class:'empty sm'}, h('p',null, withEvents ? 'Nothing on this day.' : 'Nothing due this day.'))),
    studyBlock(sel, cls, 'Studying this day'));

  return [h('div',{class:'cal'},...cells), dayview];
}

/* ---------- events: appointments, concerts, practices, reminders… ---------- */
const EV_KINDS = [['appointment','Appointment','APPT'],['concert','Concert / performance','SHOW'],['practice','Practice / rehearsal','PRAC'],
  ['game','Game / meet','GAME'],['meeting','Club / meeting','MTG'],['work','Work shift','WORK'],['birthday','Birthday','BDAY'],
  ['reminder','Reminder','REM'],['other','Other','EVT']];
const EV_LABEL = Object.fromEntries(EV_KINDS.map(([k,l])=>[k,l]));
const EV_SHORT = Object.fromEntries(EV_KINDS.map(([k,,s])=>[k,s]));
const REMIND_OPTS = [['','No reminder'],['0','At the start'],['10','10 minutes before'],['30','30 minutes before'],['60','1 hour before'],['120','2 hours before'],['1440','1 day before']];
// every event that happens on a day (repeating ones included), sorted by time
function eventsOn(ds){
  const out = [];
  for(const ev of state.events){
    let hit = ev.date===ds;
    if(!hit && ev.repeat && ev.repeat!=='none' && ds>ev.date && (!ev.until || ds<=ev.until)){
      const gap = between(ev.date, ds);
      if(ev.repeat==='weekly') hit = gap % 7 === 0;
      else if(ev.repeat==='daily') hit = true;
      else if(ev.repeat==='weekdays') hit = ![0,6].includes(parse(ds).getDay());
      else if(ev.repeat==='yearly') hit = ev.date.slice(5)===ds.slice(5);
    }
    if(hit) out.push({...ev, src:ev, on:ds, doneToday:(ev.doneOn||[]).includes(ds)});
  }
  return out.sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
}
function gcalLink(ev, ds){
  const day = (ds||ev.date).replace(/-/g,'');
  let dates;
  if(ev.time){
    const st = day+'T'+ev.time.replace(':','')+'00';
    const endT = ev.end || (()=>{ const [h,m]=ev.time.split(':').map(Number); const e=h*60+m+60; return pad(Math.min(23,Math.floor(e/60)))+':'+pad(e%60); })();
    dates = st+'/'+day+'T'+endT.replace(':','')+'00';
  } else { const next = addDays(ds||ev.date,1).replace(/-/g,''); dates = day+'/'+next; }
  const q = new URLSearchParams({action:'TEMPLATE', text:ev.title, dates, details: [ev.notes||'', 'From My Planner'].filter(Boolean).join('\n'), location: ev.place||''});
  try { q.set('ctz', Intl.DateTimeFormat().resolvedOptions().timeZone); } catch {}
  if(ev.repeat==='weekly' || ev.repeat==='daily' || ev.repeat==='yearly' || ev.repeat==='weekdays'){
    const rule = ev.repeat==='weekdays' ? 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR' : 'FREQ='+ev.repeat.toUpperCase();
    q.set('recur','RRULE:'+rule+(ev.until?';UNTIL='+ev.until.replace(/-/g,''):''));
  }
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function scheduleBlock(ds, onToday){
  const evs = eventsOn(ds);
  if(!evs.length && !onToday) return null;
  const toggle = async (ev, v) => {
    const src = ev.src; const set = new Set(src.doneOn||[]); v ? set.add(ds) : set.delete(ds);
    await store.update('events', src.id, {doneOn:[...set]});
    if(v) toast(`Done: ${ev.title}`, {label:'Undo', run: async()=>{ const s2=new Set(src.doneOn||[]); s2.delete(ds); await store.update('events', src.id, {doneOn:[...s2]}); }});
  };
  const rows = evs.map(ev=>h('li',{class:'evrow'+(ev.doneToday?' done':'')},
    ev.kind==='reminder' ? h('input',{type:'checkbox',id:`evd-${ev.id}-${ds}`,checked:ev.doneToday||null,'aria-label':'Done',onchange:e=>toggle(ev,e.target.checked)})
      : h('span',{class:'tm'}, ev.time ? fmtTime(ev.time) : 'All day'),
    h('span',{class:'kd'}, EV_LABEL[ev.kind]||'Event'),
    h('div',{style:'min-width:0'},
      h('button',{class:'tt',onclick:()=>openEventModal(ev.src)}, ev.title),
      h('div',{class:'sub'}, [ev.kind==='reminder' && ev.time ? fmtTime(ev.time) : '', ev.end ? 'until '+fmtTime(ev.end) : '', ev.place||'', ev.repeat && ev.repeat!=='none' ? 'repeats '+ev.repeat : ''].filter(Boolean).join(' · '))),
    h('a',{class:'gcal',href:gcalLink(ev, ds),target:'_blank',rel:'noopener',title:'Add to Google Calendar to get phone notifications'},'+ Google Cal')));
  return h('section',null,
    h('div',{class:'sched-h'}, h('h2',null, onToday ? 'Schedule' : 'Events'),
      h('button',{class:'btn sm',onclick:()=>openEventModal(null, ds)},'+ Add event')),
    rows.length ? h('ul',{class:'evlist'}, ...rows) : h('p',{class:'hint',style:'margin:6px 0 0'},'No appointments or events. Add practices, concerts, appointments or reminders here.'));
}
function openEventModal(ev, presetDate){
  const isNew = !ev;
  const d = ev ? {...ev} : {title:'', kind:'appointment', date: presetDate || todayIso(), time:'', end:'', place:'', notes:'', remind: String(state.prefs.before ?? 30), repeat:'none', until:''};
  const f = (label, ctl, full) => h('div',{class:'field', style: full ? 'grid-column:1/-1' : null}, h('label',{for:ctl.id},label), ctl);
  const title = h('input',{id:'evTitle',maxlength:'100',placeholder:'e.g. Dentist, Choir concert, Soccer practice',value:d.title});
  const kind = h('select',{id:'evKind'}, ...EV_KINDS.map(([k,l])=>h('option',{value:k,selected:d.kind===k||null},l)));
  const date = h('input',{id:'evDate',type:'date',value:d.date});
  const time = h('input',{id:'evTime',type:'time',value:d.time||''});
  const end = h('input',{id:'evEnd',type:'time',value:d.end||''});
  const place = h('input',{id:'evPlace',maxlength:'100',placeholder:'Optional',value:d.place||''});
  const remind = h('select',{id:'evRemind'}, ...REMIND_OPTS.map(([v,l])=>h('option',{value:v,selected:String(d.remind??'')===v||null},l)));
  const repeat = h('select',{id:'evRepeat',onchange:()=>{ untilWrap.hidden = repeat.value==='none'; }},
    ...[['none','Doesn’t repeat'],['weekly','Every week'],['weekdays','Every weekday'],['daily','Every day'],['yearly','Every year']].map(([v,l])=>h('option',{value:v,selected:(d.repeat||'none')===v||null},l)));
  const until = h('input',{id:'evUntil',type:'date',value:d.until||''});
  const untilWrap = f('Repeat until (optional)', until); untilWrap.hidden = (d.repeat||'none')==='none';
  const notes = h('textarea',{id:'evNotes',maxlength:'500',placeholder:'Optional'}); notes.value = d.notes||'';
  const err = h('p',{class:'err',hidden:true});
  let armed = false;
  const del = !isNew ? h('button',{type:'button',class:'btn danger',onclick:async e=>{
    if(!armed){ armed=true; e.target.classList.add('armed'); e.target.textContent='Confirm delete'; return; }
    await store.remove('events', ev.id); closeModal(); toast('Event deleted');
  }},'Delete') : null;
  const form = h('form',{class:'modal',onsubmit:async e=>{
    e.preventDefault();
    const t = title.value.trim();
    if(!t){ err.hidden=false; err.textContent='Give it a name.'; return; }
    if(!date.value){ err.hidden=false; err.textContent='Pick a date.'; return; }
    const data = {title:t, kind:kind.value, date:date.value, time:time.value||'', end:end.value||'', place:place.value.trim(), notes:notes.value.trim(),
      remind: remind.value, repeat: repeat.value, until: repeat.value==='none' ? '' : (until.value||'')};
    if(isNew) await store.add('events', {...data, doneOn:[], created:Date.now()}); else await store.update('events', ev.id, data);
    closeModal(); toast(isNew ? `Added ${t}` : 'Saved');
  }},
    h('h2',null, isNew ? 'Add an event' : 'Edit event'),
    h('div',{class:'row2'}, f('What is it?', title, true), f('Type', kind), f('Date', date), f('Starts (optional)', time), f('Ends (optional)', end),
      f('Where', place), f('Reminder', remind), f('Repeats', repeat), untilWrap, f('Notes', notes, true)),
    err,
    h('p',{class:'hint',style:'margin:0 0 8px'},'Reminders pop up while My Planner is open (turn them on in Settings). For phone alerts, use “+ Google Cal” on the event.'),
    h('div',{class:'modal-foot'}, del, h('div',{class:'r'}, h('button',{type:'button',class:'btn',onclick:closeModal},'Cancel'), h('button',{type:'submit',class:'btn primary'}, isNew?'Add':'Save'))));
  showModal(form);
}
function renderCalendarPage(){
  const t = todayIso();
  if(!state.calDay) state.calDay = t;
  const all = state.items.filter(i=>classById(i.classId));
