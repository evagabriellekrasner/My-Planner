const notifSupported = () => typeof Notification !== 'undefined';
function firedSet(){ try { return new Set(JSON.parse(LS.get('planner:fired:'+(state.user&&state.user.key))||'[]')); } catch { return new Set(); } }
function markFired(set){ LS.set('planner:fired:'+(state.user&&state.user.key), JSON.stringify([...set].slice(-400))); }
const VAPID_PUBLIC = 'BM9UBkIGPcAcChqinnK1s99uGsHSixmKiE6P5ZoqMUYY2U99H6Dve-YA2TyVdQC8HR9S3QAwOPlyA7JFm8UOFmc';
let swReg = null;
async function getSW(){
  if(swReg) return swReg;
  if(!('serviceWorker' in navigator) || location.protocol!=='https:') return null;
  try { swReg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; return swReg; } catch { return null; }
}
if('serviceWorker' in navigator){
  getSW();
  navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.goPage && state.user) goPage(e.data.goPage); });
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isInstalled = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && notifSupported();
async function notify(title, body, tag){
  const opts = {body, tag, icon: iconPath(192), badge: iconPath(192), data:{page:'today'}};
  try { const reg = await getSW(); if(reg){ await reg.showNotification(title, opts); return true; } } catch {}
  try { const n = new Notification(title, opts); n.onclick = () => { window.focus(); goPage('today'); n.close(); }; return true; } catch { return false; }
}
function b64uToBytes(s){ const pad='='.repeat((4-s.length%4)%4); const b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c=>c.charCodeAt(0)); }
// subscribe this device so reminders arrive even when the planner is closed
async function enablePush(quiet){
  const reg = await getSW(); if(!reg || !('PushManager' in window)) return false;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: b64uToBytes(VAPID_PUBLIC)});
  const j = sub.toJSON(); let tz = 'America/Chicago'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch {}
  if(FIREBASE_CONFIG && state.user) await cloudPush(state.user.key, p => { p.subs = (p.subs||[]).filter(x=>x.endpoint!==j.endpoint); p.subs.push({endpoint:j.endpoint, keys:j.keys, added:Date.now()}); p.tz = tz; return p; });
  return true;
}
async function disablePush(){
  const reg = await getSW(); const sub = reg && await reg.pushManager.getSubscription(); if(!sub) return;
  const ep = sub.endpoint;
  if(FIREBASE_CONFIG && state.user) await cloudPush(state.user.key, p => { p.subs = (p.subs||[]).filter(x=>x.endpoint!==ep); return p; }).catch(()=>{});
}
function checkReminders(){
  if(!state.user || !state.prefs.notifyOn || !notifSupported() || Notification.permission!=='granted') return;
  // (the reminder service sends these too; the same tag means a phone only shows one)
  const now = new Date(), t = iso(now), mins = now.getHours()*60 + now.getMinutes();
  const fired = firedSet(); let changed = false;
  const fire = (key, title, body) => { if(fired.has(key)) return; fired.add(key); changed = true; notify(title, body, key); };
  // events (today and tomorrow, for "1 day before")
  for(const ds of [t, addDays(t,1)]){
    for(const ev of eventsOn(ds)){
      if(ev.remind==='' || ev.remind==null || ev.doneToday) continue;
      const start = ev.time ? ev.time.split(':').map(Number).reduce((h,m)=>h*60+m) : 8*60;
      const at = start - Number(ev.remind) + (ds===t ? 0 : 1440);
      if(mins >= at && mins < at + 90) fire(`ev:${ev.id}:${ds}`, ev.title, `${ds===t?'Today':'Tomorrow'}${ev.time?' at '+fmtTime(ev.time):''}${ev.place?' · '+ev.place:''}`);
    }
  }
  // daily summary
  const [dh,dm] = (state.prefs.daily||'07:30').split(':').map(Number), dAt = dh*60+dm;
  if(state.prefs.daily && mins >= dAt && mins < dAt + 180){
    const list = todosFor(t).filter(x=>!x.done), imp = list.filter(x=>x.imp);
    const evs = eventsOn(t).filter(e=>e.kind!=='reminder');
    const bits = [];
    if(imp.length) bits.push(`${imp.length} important: ${imp.slice(0,3).map(x=>x.text).join(', ')}`);
    else if(list.length) bits.push(`${list.length} thing${list.length===1?'':'s'} to do`);
    if(evs.length) bits.push(`${evs.length} event${evs.length===1?'':'s'}: ${evs.slice(0,2).map(e=>e.title).join(', ')}`);
    if(bits.length) fire(`daily:${t}`, 'Your day in My Planner', bits.join(' · '));
  }
  if(changed) markFired(fired);
}
setInterval(checkReminders, 30000);
document.addEventListener('visibilitychange', checkReminders);

/* ---------- calendar file: import into Google/Apple Calendar for phone alerts ---------- */
function icsText(){
  const esc = s => String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Planner//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:My Planner'];
  const t = todayIso();
  for(const ev of state.events){
    if(ev.date < addDays(t,-1) && (!ev.repeat || ev.repeat==='none')) continue;
    const day = ev.date.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:ev-'+ev.id+'@my-planner','DTSTAMP:'+stamp,'SUMMARY:'+esc(ev.title));
    if(ev.time){ L.push('DTSTART:'+day+'T'+ev.time.replace(':','')+'00'); if(ev.end) L.push('DTEND:'+day+'T'+ev.end.replace(':','')+'00'); }
    else L.push('DTSTART;VALUE=DATE:'+day, 'DTEND;VALUE=DATE:'+addDays(ev.date,1).replace(/-/g,''));
    if(ev.place) L.push('LOCATION:'+esc(ev.place));
    if(ev.notes) L.push('DESCRIPTION:'+esc(ev.notes));
    if(ev.repeat && ev.repeat!=='none'){ const rule = ev.repeat==='weekdays' ? 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR' : 'FREQ='+ev.repeat.toUpperCase(); L.push('RRULE:'+rule+(ev.until?';UNTIL='+ev.until.replace(/-/g,'')+'T235959':'')); }
    if(ev.remind!=='' && ev.remind!=null) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(ev.title),'TRIGGER:-PT'+Number(ev.remind)+'M','END:VALARM');
    L.push('END:VEVENT');
  }
  for(const i of state.items){
    const c = classById(i.classId); if(!c || i.done || i.due < t) continue;
    const day = i.due.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:hw-'+i.id+'@my-planner','DTSTAMP:'+stamp,'SUMMARY:'+esc(`${c.name}: ${i.title} (${TYPE_LABEL[i.type]||'Due'})`),
      'DTSTART;VALUE=DATE:'+day,'DTEND;VALUE=DATE:'+addDays(i.due,1).replace(/-/g,''),'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(i.title+' is due tomorrow'),'TRIGGER:-PT6H','END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(){
  const blob = new Blob([icsText()], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-planner.ics';
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Calendar file saved to your downloads');
}

const customSeen = new Set();
function customColorCss(keys){
  let el = document.getElementById('customColors');
  if(!el){ el = document.createElement('style'); el.id='customColors'; document.head.append(el); }
  let added = false;
  for(const k of keys){
    if(!/^x[0-9a-f]{6}$/i.test(k||'') || customSeen.has(k)) continue;
    customSeen.add(k); added = true;
    const n = parseInt(k.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
    const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    el.textContent += `.sw-${k}{background:#${k.slice(1)}!important;color:${lum<0.55?'#ffffff':'#2b2730'}!important}\n`;
  }
  return added;
}

/* ---------- daily to-do list ---------- */
const between = (a,b) => Math.round((parse(b)-parse(a))/864e5);   // days from a to b
const IMPORTANT = 60;
function todosFor(ds){
  const t = todayIso(), out = [];
  for(const i of state.items){
    const c = classById(i.classId); if(!c) continue;
    const d = between(ds, i.due), tq = i.type==='test'||i.type==='quiz', T = TYPE_LABEL[i.type]||'Assignment';
    let score=0, why='';
    if(ds===t && i.due<t && !i.done){ score=100; why=`Past due · was due ${dayLabel(i.due)}`; }
    else if(d===0){ score = tq?95:85; why = tq ? `${T} today${i.time?' at '+fmtTime(i.time):''}` : `Due today`; }
    else if(d===1){ score = tq?75:65; why = tq ? `${T} tomorrow · study tonight` : `Due tomorrow · finish it today`; }
    else if(d>=2 && d<=3 && (tq || i.type==='project')){ score=25; why=`${T} ${dayLabel(i.due)} · coming up`; }
    else continue;
    out.push({key:'i'+i.id+ds, kind:'item', ref:i, text:i.title, why, cls:c, score, done:!!i.done, type:i.type});
  }
  for(const plan of state.plans){
    const c = planClass(plan); if(!c) continue;
    const test = planTestDate(plan), title = planTitle(plan);
    for(const s of plan.sessions||[]){
      const missed = ds===t && s.date<t && test>=t;
      if(s.date!==ds && !missed) continue;
      for(const k of s.tasks){
        if(missed && k.done) continue;
        const dd = between(ds, test);
        const score = missed ? 55 : dd<=2 ? 70 : 45;
        const why = (missed ? `Missed study task from ${dayLabel(s.date)} · ` : 'Study · ') + `${title} ${dd===0?'today':dd===1?'tomorrow':'in '+dd+' days'}`;
        out.push({key:'s'+plan.id+k.id, kind:'study', plan, date:s.date, ref:k, text:k.text, why, cls:c, score, done:!!k.done});
      }
    }
  }
  for(const x of state.todos.filter(x=>x.date===ds)){
    out.push({key:'t'+x.id, kind:'todo', ref:x, text:x.text, why:'Your to-do', cls:null, score: x.star?90:50, done:!!x.done});
  }
  out.forEach(x=>{ x.imp = x.score>=IMPORTANT; });
  return out.sort((a,b)=> (a.done-b.done) || (b.score-a.score) || a.text.localeCompare(b.text));
}

  if(x.kind==='study') return toggleTask(x.plan.id, x.date, x.ref.id, done);

/* ---------- study tracker ---------- */
const SUGGEST = ['Review class notes','Make flashcards','Do practice problems','Reread the chapter','Redo old homework','Take a practice test','Go over the study guide'];

// "8 page study guide" -> split pages across the study days
const AMOUNT = /\b(\d{1,4})[\s-]*(?:[a-z]+[\s-]+){0,2}?(pages?|pgs?|problems?|questions?|chapters?|sections?|slides?|flashcards?|cards?|terms?|words?|lessons?|worksheets?)\b/i;
const UNIT_NAME = u => { u=u.toLowerCase(); if(/^pg/.test(u)) return 'page'; if(u==='cards'||u==='card') return 'card'; return u.replace(/s$/,''); };
const cap = x => x ? x[0].toUpperCase()+x.slice(1) : x;
// "study guide and do a kahoot" -> two tasks
function splitTaskText(raw){
  return String(raw).split(/\s*(?:,|\band\b|&|\+)\s*(?=(?:do|make|take|finish|complete|read|review|study|watch|write|practice|redo|go|learn|quiz|memorize|outline|fill)\b)/i)
    .map(x=>cap(x.trim())).filter(Boolean);
}
function chunks(total, parts){
  const out=[]; let from=1;
  for(let k=0;k<parts;k++){ const size=Math.floor(total/parts)+(k<total%parts?1:0); out.push([from, from+size-1]); from+=size; }
  return out;
}
function buildSessions(testDate, days, rawTasks){
  const t = todayIso();
  const n = Math.min(days, diff(testDate));
  const dates = [];
  if(n<=0) dates.push(t); else for(let k=n;k>=1;k--) dates.push(addDays(testDate,-k));
  const D = dates.length;
  const sessions = dates.map(d=>({date:d, tasks:[]}));
  const tasks = rawTasks.flatMap(splitTaskText);
  const whole = [];
  for(const text of tasks){
    const m = text.match(AMOUNT), total = m ? parseInt(m[1],10) : 0;
    if(m && D>1 && total>1){
      const parts = Math.min(D, total), unit = UNIT_NAME(m[2]);
      chunks(total, parts).forEach(([a,b],k)=>{
        const day = Math.floor(k*D/parts);
        const range = a===b ? `${unit} ${a}` : `${unit}s ${a}–${b}`;
        sessions[day].tasks.push(`${text}: ${range}`);
      });
    } else whole.push(text);
  }
  // whole tasks: fill the emptiest days, leaning toward the days closest to the test
  whole.forEach(text=>{
    let best = sessions.findIndex(x=>!x.tasks.length);          // first empty day, in order
    if(best<0){ best = D-1; for(let d=D-1; d>=0; d--) if(sessions[d].tasks.length < sessions[best].tasks.length) best = d; }
    sessions[best].tasks.push(text);
  });
  // any day still empty gets a review of what came before
  const reviewable = whole.length ? whole : ['your notes for the test'];
  let r = 0;
  sessions.forEach((s,i)=>{ if(!s.tasks.length) s.tasks.push(i===D-1 && D>1 ? 'Final review: go over everything' : 'Review: '+reviewable[(r++)%reviewable.length]); });
  sessions.forEach(s=>{ s.tasks = s.tasks.map(text=>({id:uidGen(), text, done:false})); });
  return sessions;
}
const planTestDate = p => { const it = p.itemId && state.items.find(i=>i.id===p.itemId); return it ? it.due : p.testDate; };
const planClass = p => { const it = p.itemId && state.items.find(i=>i.id===p.itemId); return classById(it ? it.classId : p.classId); };
const planTitle = p => { const it = p.itemId && state.items.find(i=>i.id===p.itemId); return it ? it.title : p.title; };
function studyPlansOn(ds, cls){
  const out = [];
  for(const plan of state.plans){
    const c = planClass(plan); if(!c) continue; if(cls && c.id!==cls.id) continue;
    const sess = (plan.sessions||[]).find(s=>s.date===ds);
    if(sess && sess.tasks.length) out.push({plan:{...plan, title:planTitle(plan)}, sess, cls:c});
  }
  return out;
}

/* ---------- import assignments from a PDF or pasted text ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=()=>rej(new Error('load')); document.head.append(el); }); }
async function pdfPages(file, onPage){
  await loadScript(PDFJS+'pdf.min.js');
  await loadScript(PDFJS+'pdf.worker.min.js');   // runs pdf.js on the page itself, no separate worker needed
  const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js';
  const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const pages = [], total = Math.min(pdf.numPages, 150);
  for(let n=1; n<=total; n++){
    onPage && onPage(n, total);
    const page = await pdf.getPage(n), tc = await page.getTextContent();
    // rebuild lines (and table rows) from text positions
    const rows = new Map();
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const y = Math.round((it.transform?it.transform[5]:0)/3)*3, x = it.transform?it.transform[4]:0;
      if(!rows.has(y)) rows.set(y, []);
      rows.get(y).push({x, w: it.width||0, s:it.str});
    }
    const lines = [];
    for(const [,items] of [...rows.entries()].sort((a,b)=>b[0]-a[0])){
      items.sort((a,b)=>a.x-b.x);
      const cells = [];
      for(const it of items){
        const last = cells[cells.length-1];
        if(last && it.x - last.end < 14){ last.s += (/\s$/.test(last.s)||/^\s/.test(it.s) ? '' : ' ') + it.s; last.end = it.x + it.w; }
        else cells.push({x: Math.round(it.x), s: it.s, end: it.x + it.w});
      }
      const cs = cells.map(c=>({x:c.x, s:c.s.replace(/\s+/g,' ').trim()})).filter(c=>c.s);
      if(cs.length) lines.push(cs);
    }
    pages.push(lines.map(cs=>cs.map(c=>c.s).join(' | ')).join('\n'));
    (pages.cells = pages.cells || []).push(...lines, null);   // null marks a page break
  }
  return pages;
}
function chunkText(pages, max=14000){
  const out=[]; let cur='';
  for(const pg of pages){
    if(pg.length > max){ if(cur){ out.push(cur); cur=''; } for(let i=0;i<pg.length;i+=max) out.push(pg.slice(i,i+max)); continue; }
    if(cur.length + pg.length > max){ out.push(cur); cur=''; }
    cur += (cur?'\n\n':'') + pg;
  }
  if(cur.trim()) out.push(cur);
  return out;
}
// school year: Aug–Dec belong to the fall year, Jan–Jul to the spring year
const schoolStartYear = () => { const d=new Date(); return d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1; };
const yearFor = m => m>=7 ? schoolStartYear() : schoolStartYear()+1;
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function guessType(t){ t=t.toLowerCase(); return /\b(project|essay|paper|presentation|lab report)\b/.test(t)?'project':/\b(test|exam|midterm|final|assessment)\b/.test(t)?'test':/\bquiz/.test(t)?'quiz':/\b(read|chapter|ch\.)\b/.test(t)?'reading':'homework'; }
function localParse(text){   // backup when Claude can't be asked: lines that contain a date
  const out=[];
  for(const raw of text.split('\n')){
    const line = raw.replace(/\|/g,' ').replace(/\s+/g,' ').trim(); if(line.length<4) continue;
    let m, mo=null, d=null, y=null, hit='';
    if((m = line.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/i))){ mo=MONTHS.indexOf(m[1].slice(0,3).toLowerCase()); d=+m[2]; y=m[3]?+m[3]:null; hit=m[0]; }
    else if((m = line.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){ mo=+m[1]-1; d=+m[2]; y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null; hit=m[0]; }
    if(mo===null || mo<0 || mo>11 || d<1 || d>31) continue;
    const title = line.replace(hit,'').replace(/\b(mon|tues?|wed|thur?s?|fri|sat|sun)[a-z]*\.?,?/ig,'').replace(/\bdue\b:?/ig,'').replace(/^[\s\-–:,.]+|[\s\-–:,.]+$/g,'').replace(/\s{2,}/g,' ');
    if(title.length<3) continue;
    out.push({title:title.slice(0,80), type:guessType(title), due:`${y||yearFor(mo)}-${pad(mo+1)}-${pad(d)}`, class:null, notes:''});
  }

/* ---- smarter reading of school schedules: tells homework apart from class work ---- */
const COLS = [
  ['date', /^(date|day|dates|days|week|due date|when)$/i],
  ['hw',   /(home\s*work|^hw\b|\bhw$|assignments?\s*due|^due$|^assignment|at[- ]home|tonight|to do at home|practice)/i],
  ['test', /^(assessments?|tests?|quizzes|quiz|tests?\s*\/\s*quizzes)$/i],
  ['class',/(class\s*work|in[- ]class|^class$|agenda|activit|lesson|topic|objective|learning target|notes|warm[- ]?up|bell ?ringer|today|^do now)/i],
];
const NOTHING = /^(none|no hw|no homework|n\/a|na|-+|—|–|tbd|tba|x|no school|holiday|break)\.?$/i;
function findDate(str){
  let m;
  if((m = str.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/i))){
    const mo = MONTHS.indexOf(m[1].slice(0,3).toLowerCase()), d = +m[2];
    if(mo>=0 && d>=1 && d<=31) return {iso:`${m[3]?+m[3]:yearFor(mo)}-${pad(mo+1)}-${pad(d)}`, hit:m[0]};
  }
  // 11/4 or 11/4/26 anywhere (but not "p.1/2" or "#3/4");
  // 11-4 or 11.4 only at the very start of a line (so "Notes 3.1" and "p.1-4" aren't dates)
  const num = (mo, d, y, hit) => { mo=+mo-1; d=+d; if(mo<0||mo>11||d<1||d>31) return null; const yy = y ? (+y<100 ? 2000+ +y : +y) : yearFor(mo); return {iso:`${yy}-${pad(mo+1)}-${pad(d)}`, hit}; };
  for(const mm of str.matchAll(/(^|[^\w.#\/])(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\w\/])/g)){ const r = num(mm[2], mm[3], mm[4], mm[0].slice(mm[1].length)); if(r) return r; }
  if((m = str.match(/^\s*(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s*)?(\d{1,2})[-.](\d{1,2})(?:[-.](\d{2,4}))?(?![\w.\-])/i))){ const r = num(m[1], m[2], m[3], m[0].trim().replace(/^(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s*)/i,'')); if(r) return r; }
  if((m = str.match(/^\s*(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s*)?(\d{1,2})(?:st|nd|rd|th)?(?:-|\s)(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?(?:,?\s+(\d{4}))?/i))){
    const mo = MONTHS.indexOf(m[2].slice(0,3).toLowerCase()), d = +m[1];
    if(mo>=0 && d>=1 && d<=31) return {iso:`${m[3]?+m[3]:yearFor(mo)}-${pad(mo+1)}-${pad(d)}`, hit:m[0]};

const WEEKDAYS = ['sun','mon','tue','wed','thu','fri','sat'];
function weekdayAt(str){ const m = str.trim().match(/^(mon|tues?|wed(?:nes)?|thur?s?|fri|sat|sun)[a-z]*\.?\b/i); return m ? {i: WEEKDAYS.indexOf(m[1].slice(0,3).toLowerCase()), hit: m[0]} : null; }
const cleanTitle = t => t.replace(/\b(mon|tues?|wed|thur?s?|fri|sat|sun)[a-z]*\.?,?(?=\s|$)/ig,'').replace(/^(due|hw|homework|class\s*work|in[- ]class)\s*[:\-–]\s*/i,'').replace(/\bdue\b:?/ig,'').replace(/^[\s\-–:,.•·*]+|[\s\-–:,.•·*]+$/g,'').replace(/\s{2,}/g,' ').trim();
function kindOf(text, col){
  const t = text.toLowerCase();
  if(/\b(test|exam|midterm|final|quiz|assessment)\b/.test(t) && !/\b(review|study guide|practice test|correction)/.test(t)) return 'test';
  if(/\b(project|essay|paper|presentation|lab report)\b/.test(t)) return 'test';
  if(col==='hw' || /^(hw|homework)\b|\bdue\b/i.test(text)) return 'hw';
  if(col==='class') return 'class';

}
// split one cell like "Classwork: notes 2.3  Homework: p.45 #1-9" into labelled parts
function labelledParts(text){
  const re = /(class\s*work|in[- ]class|home\s*work|hw|assessment|quiz|test)\s*:\s*/ig;
  const marks = [...text.matchAll(re)];
  if(marks.length < 1) return null;
  const parts = [];
  marks.forEach((m,i)=>{
    const end = i+1<marks.length ? marks[i+1].index : text.length;
    const body = text.slice(m.index + m[0].length, end).trim();
    const lab = m[1].toLowerCase();
    parts.push({col: /home|hw/.test(lab) ? 'hw' : /class/.test(lab) ? 'class' : 'test', text: body});
  });
  const before = text.slice(0, marks[0].index).trim();

function smartParse(rawText, cellRows){
  // rows: arrays of {x, s}. From a PDF we have positions; pasted text uses tabs or " | " and cell order.
  const rows = cellRows && cellRows.length ? cellRows
    : rawText.split('\n').map(l => (l.includes('\t') ? l.split('\t') : l.split(' | ')).map((s,i)=>({x:i, s:s.trim(), idx:true})));
  const out = [];
  let header = null, last = null, week = null, sawHw = false;
  for(const row of rows){
    if(!row){ last = null; continue; }
    const cells = row.filter(c=>c.s);
    if(!cells.length) continue;
    // header row?
    const labels = cells.map(c=>{ const hit = COLS.find(([,re])=>re.test(c.s.replace(/[:*]/g,'').trim())); return hit ? hit[0] : null; });
    const joined = cells.map(c=>c.s).join(' ');
    if(labels.filter(Boolean).length >= 2 && labels.filter(Boolean).length >= cells.length-1 && labels.some(l=>l==='hw'||l==='class')
       && !/\d/.test(joined) && cells.every(c=>c.s.length <= 30)){
      header = cells.map((c,i)=>({x:c.x, kind:labels[i]})).filter(h=>h.kind);
      last = null; continue;
    }
    const colFor = c => {
      if(!header) return null;
      if(c.idx){ const hh = header.find(h=>h.x===c.x); return hh ? hh.kind : null; }
      let best = null, bd = Infinity;
      for(const h of header){ const d = Math.abs(h.x - c.x); if(d < bd){ bd = d; best = h; } }
      return best && bd < 160 ? best.kind : null;
    };
    const whole = cells.map(c=>c.s).join(' ');
    let date = findDate(whole);
    // "Week of 11/2" sets the week; later rows that start with Monday, Tue... get that week's dates
    if(date && /\bweek\b/i.test(whole) && cleanTitle(whole.replace(date.hit,'').replace(/week\s*(of)?/i,'')).length < 3){
      const d0 = parse(date.iso); week = addDays(date.iso, -((d0.getDay()+6)%7)); last = null; continue;
    }
    if(!date && week){ const wd = weekdayAt(cells[0].s); if(wd && wd.i>=1){ date = {iso: addDays(week, wd.i-1), hit: wd.hit}; } }
    if(!date){
      // a line without a date continues the cells of the row above (wrapped table text)
      if(last && header){ for(const c of cells){ const k = colFor(c); if(k && k!=='date' && last.parts[k]!==undefined) last.parts[k] += ' ' + c.s; else if(k && k!=='date') last.parts[k] = c.s; } }
      continue;
    }
    const parts = {};
    for(const c of cells){
      let s = c.s; if(s.includes(date.hit)) s = s.replace(date.hit,'');
      let k = colFor(c) || null;
      if(k==='date') { if(cleanTitle(s).length < 3) continue; k = null; }
      const lp = labelledParts(s);
      if(lp){ for(const p of lp){ const kk = p.col || k || 'unknown'; parts[kk] = ((parts[kk]||'') + ' ' + p.text).trim(); } continue; }
      const kk = k || 'unknown';
      parts[kk] = ((parts[kk]||'') + ' ' + s).trim();
    }
    if(parts.hw && !header) sawHw = true;
    if(parts.hw && parts.unknown && !header){ parts.class = ((parts.class||'') + ' ' + parts.unknown).trim(); delete parts.unknown; }
    last = {date: date.iso, parts};
    out.push(last);
  }
  // turn rows into items
  const items = [];
  for(const r of out){
    for(const [col, raw] of Object.entries(r.parts)){
      const pieces = col!=='hw' ? [raw] : raw.split(/\s*[;•]\s*|\s{2,}(?=\d+\.|[A-Z])/).filter(Boolean);
      for(const piece of pieces){
        const title = cleanTitle(piece);
        if(title.length < 3 || NOTHING.test(title)) continue;
        let kind = kindOf(piece, col);
        if(kind==='unknown' && sawHw && !header) kind = 'class';   // the schedule labels homework, so unlabeled lines are class work

  items.hasHeader = !!header;

}

function parseItems(text){
  const t = String(text||'');
  const a = t.indexOf('['), b = t.lastIndexOf(']');
  if(a>=0 && b>a){ try { const v = JSON.parse(t.slice(a,b+1)); if(Array.isArray(v)) return v; } catch {} }
  const out = [];   // answer cut short: keep every complete {...}

async function claudeParse(chunks, onProgress){

    const prompt = `You read part ${i+1} of ${chunks.length} of a school document: a syllabus, assignment list, pacing guide or class calendar. It may be a table (cells are separated by " | "), a list, or paragraphs, and dates can be written many ways (9/12, Sept 12, Monday 9-12, "Week of Oct 5").
List EVERY assignment, homework, worksheet, test, quiz, exam, project, lab and reading in this part that has a date. Include all of them even if there are hundreds; do not summarize or merge rows.
Today is ${todayIso()}. The school year runs from August ${start} to July ${start+1}: a date with no year in August–December is ${start}, in January–July is ${start+1}.
If only a week is given, use the last school day (Friday) of that week. If a row has a start and a due date, use the due date.
The student's classes are: ${names.map(n=>JSON.stringify(n)).join(', ')}. If an item clearly belongs to one of them, use that exact name; otherwise null.
Answer with ONLY a JSON array, no other text. Each element: {"title": short clear name with its number if it has one, e.g. "HW 3.2 p.145 #1-25" or "Unit 2 Test" (max 80 characters), "type": one of "homework","test","quiz","project","reading","other", "due": "YYYY-MM-DD", "class": a class name from the list or null, "notes": a short useful detail or ""}.
Answer [] if this part has no dated items.

Document part ${i+1}:
"""
${chunks[i]}
"""`;
    try {
      const { text } = await sample(prompt, {modelTier:'default'});
      all.push(...parseItems(text));
    } catch(e){
      if(e && (e.code==='not_granted') && i===0) return null;
      failed++;
      if(e && e.code==='rate_limited') await new Promise(r=>setTimeout(r,4000));
    }
  }
  return {items: all, failed};
}

async function addMany(rows, onProgress){
  let n = 0;
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    const data = {type:r.type,title:r.title.trim(),classId:r.classId,due:r.due,time:'',notes:r.notes||'',done:false,created:Date.now()+i};
    onProgress(i+1, rows.length);
    if(state.mode!=='db'){ state.items.push({id:uidGen(),...data}); n++; if(i===rows.length-1) persist(); continue; }
    for(let attempt=0; attempt<4; attempt++){
      try { await refs.items.doc().set(data); n++; break; }
      catch(e){
        const code = e && e.code;
        if(code==='quota_exceeded' || code==='invalid_argument'){ return {n, stop:code}; }
        await new Promise(res=>setTimeout(res, 800*(2**attempt)));
      }
    }
  }
  return {n};
}

function openPdfModal(presetCls){
  const view = {stage:'pick', rows:[], msg:'', progress:'', defaultClass:(presetCls||sortedClasses()[0]||{}).id, source:'', failed:0, paste:''};
  const box = h('div',{class:'modal wide',role:'dialog','aria-label':'Import assignments'});
  const classOpts = sel => sortedClasses().map(c=>h('option',{value:c.id,selected:sel===c.id||null},c.name));
  const busy = (msg) => { view.stage='busy'; view.progress=msg; draw(); };

  async function fromPages(pages){
    const text = pages.join('\n\n'); view.lastText = text;
    if(text.replace(/\s/g,'').length < 20){ view.stage='pick'; view.msg='There’s no text to read here (a scanned PDF or photo). Try a PDF where you can highlight the words, or paste the text instead.'; draw(); return; }
    const chunks = chunkText(pages);
    let res = null;
    try { res = await claudeParse(chunks, (i,n,found)=>busy(n>1 ? `Finding assignments: part ${i} of ${n} (${found} found so far)…` : 'Finding assignments and due dates…')); }
    catch { res = null; }
    let found;
    if(res){ found = res.items; view.source='claude'; view.failed = res.failed; }
    else {
      found = smartParse(text, pages.cells);
      if(found.length < 2){ const simple = localParse(text); if(simple.length > found.length) found = simple; }
      view.source='local'; view.dates = found.dates || [];
    }
    const byName = new Map(state.classes.map(c=>[c.name.toLowerCase(), c.id]));
    const seen = new Set(), t = todayIso();
    view.rows = found.filter(x=>x && x.title && /^\d{4}-\d{2}-\d{2}$/.test(x.due||'')).map(x=>({
      title:String(x.title).slice(0,140), type: TYPE_LABEL[x.type] ? x.type : guessType(String(x.title)), due:x.due,
      classId:(x.class && byName.get(String(x.class).toLowerCase())) || view.defaultClass, notes: x.notes ? String(x.notes).slice(0,300) : '',
      kind: x.kind || (x.type==='test'||x.type==='quiz'||x.type==='project' ? 'test' : 'hw'), due0: x.due
    })).filter(r=>{ const k=r.title.toLowerCase()+'|'+r.due; if(seen.has(k)) return false; seen.add(k); return true; })
      .sort((a,b)=>a.due.localeCompare(b.due))
      .map((r,i)=>({...r, key:'r'+i}));
    view.show = 'hw'; applyPick();
    view.stage='review'; view.msg=''; draw();
  }
  function nextClassDay(d){
    const later = (view.dates||[]).find(x=>x>d);
    if(later && between(d, later) <= 7) return later;
    let n = addDays(d,1); while([0,6].includes(parse(n).getDay())) n = addDays(n,1); return n;
  }
  function applyShift(){ view.rows.forEach(r=>{ r.due = (view.hwNext && r.kind==='hw') ? nextClassDay(r.due0) : r.due0; }); view.rows.sort((a,b)=>a.due.localeCompare(b.due)); }
  function applyPick(){
    const t = todayIso();
    view.rows.forEach(r=>{ r.on = r.due >= t && (view.show==='all' || r.kind!=='class'); });
  }
  function newClassRow(){
    const inp = h('input',{id:'pdfNewClass',maxlength:'60',placeholder:'New class name, e.g. Chemistry',autocomplete:'off',
      style:'flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--accent);border-radius:10px;padding:9px 10px'});
    const make = async () => {
      const nm = inp.value.trim(); if(!nm){ inp.focus(); return; }
      const ex = state.classes.find(c=>c.name.toLowerCase()===nm.toLowerCase());
      const id = ex ? ex.id : await store.add('classes',{name:nm, color:nextColor(), teacher:'', created:Date.now()});
      if(!id) return;
      view.defaultClass = id; view.allClass = id; view.newClassOpen = false;
      view.rows.forEach(r=>{ if(view.stage==='review') r.classId = id; });
      draw(); toast(ex ? `Using ${nm}` : `Added ${nm}`);
    };
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); make(); } if(e.key==='Escape'){ view.newClassOpen=false; draw(); } });
    return h('div',{style:'display:flex;gap:8px;margin-top:8px'}, inp, h('button',{type:'button',class:'btn primary',onclick:make},'Add class'));
  }
  async function handleFile(file){
    if(!file) return;
    if(!/\.pdf$/i.test(file.name) && file.type!=='application/pdf'){ view.msg='That file isn’t a PDF. Pick a .pdf file, or paste the text below.'; draw(); return; }
    busy('Opening your PDF…');
    let pages;
    try { pages = await pdfPages(file, (n,tot)=>{ if(n%5===1||n===tot) busy(`Reading page ${n} of ${tot}…`); }); }
    catch { view.stage='pick'; view.msg='Couldn’t open that PDF. Try downloading it again, or paste the text below instead.'; draw(); return; }
    fromPages(pages);
  }
  function handlePaste(){
    const t = view.paste.trim();
    if(t.length<10){ view.msg='Paste the list of assignments first.'; draw(); return; }
    const parts=[]; for(let i=0;i<t.length;i+=14000) parts.push(t.slice(i,i+14000));
    fromPages(parts);
  }
  async function addAll(){
    const pick = view.rows.filter(r=>r.on && r.title.trim());
    if(!pick.length){ view.msg='Tick at least one assignment to add.'; draw(); return; }
    const res = await addMany(pick, (i,n)=>busy(`Adding ${i} of ${n} to your planner…`));
    closeModal(); render();
    toast(res.stop==='quota_exceeded' ? `Added ${res.n}. Your planner is full, so the rest weren’t added.` : res.stop ? `Added ${res.n}. The rest couldn’t be saved.` : `Added ${res.n} assignment${res.n===1?'':'s'}`);
  }

  function draw(){
    const kids = [h('h2',null,'Import assignments')];
    if(view.stage==='pick'){
      const input = h('input',{type:'file',id:'pdfFile',accept:'application/pdf,.pdf',onchange:e=>handleFile(e.target.files[0])});
      const drop = h('div',{class:'drop',
        ondragover:e=>{e.preventDefault(); drop.classList.add('over');}, ondragleave:()=>drop.classList.remove('over'),
        ondrop:e=>{e.preventDefault(); drop.classList.remove('over'); handleFile(e.dataTransfer.files[0]);}},
        h('p',{style:'margin:0;font-weight:800;color:var(--ink)'},'Drop a PDF here: a syllabus, a homework list, or a whole year’s calendar'),
        h('p',{style:'margin:4px 0 0'},'or choose the file:'), input);
      const ta = h('textarea',{id:'pasteText',placeholder:'…or paste the list here (from a website, email or doc)',
        style:'width:100%;min-height:90px;margin-top:12px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px;resize:vertical',
        oninput:e=>{view.paste=e.target.value;}}); ta.value = view.paste;
      kids.push(h('p',{class:'lead',style:'margin:0 0 12px'},'The planner reads it, finds every line with an assignment and a date (even hundreds), and you check them before anything is added.'),
        drop, ta,
        h('div',{class:'qf',style:'margin-top:10px'}, h('span',null,'Which class is this for?'),
          h('select',{id:'pdfClass',onchange:e=>{ if(e.target.value==='__new'){ view.newClassOpen=true; draw(); setTimeout(()=>document.getElementById('pdfNewClass')?.focus(),30); return; } view.defaultClass=e.target.value; view.allClass=e.target.value; }},
            ...classOpts(view.defaultClass), h('option',{value:'__new'},'+ New class…'))),
        view.newClassOpen ? newClassRow() : null);
      if(view.msg) kids.push(h('p',{class:'err',style:'margin:10px 0 0'},view.msg));
      kids.push(h('div',{class:'modal-foot',style:'margin-top:14px'}, h('div',{class:'r'},
        h('button',{type:'button',class:'btn',onclick:closeModal},'Cancel'),
        h('button',{type:'button',class:'btn primary',onclick:handlePaste},'Read pasted text'))));
    } else if(view.stage==='busy'){
      kids.push(h('p',{style:'padding:24px 0 6px;text-align:center;font-weight:700'}, h('span',{class:'spin'}), view.progress),
        h('p',{class:'hint',style:'text-align:center'},'A long PDF can take a minute. Keep this open.'));
    } else {
      const on = view.rows.filter(r=>r.on).length, past = view.rows.filter(r=>r.due<todayIso()).length;
      if(!view.rows.length){
        view.paste = view.lastText || view.paste;
        kids.push(h('div',{class:'empty sm'}, h('p',null,'No assignments with dates were found. Below is the text the planner read from your file. Make sure each assignment has a date on its line (like “11/4 HW p.45 #1-10”), then press “Read pasted text”.')),
          (()=>{ const ta = h('textarea',{id:'pasteFix',style:'width:100%;min-height:160px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px;font-size:13px',oninput:e=>{view.paste=e.target.value;}}); ta.value = view.paste||''; return ta; })(),
          h('div',{class:'modal-foot',style:'margin-top:10px'}, h('button',{type:'button',class:'btn',onclick:()=>{view.stage='pick';view.msg='';draw();}},'Start over'),
            h('div',{class:'r'}, h('button',{type:'button',class:'btn',onclick:closeModal},'Cancel'), h('button',{type:'button',class:'btn primary',onclick:handlePaste},'Read pasted text'))));
      } else {
        kids.push(h('p',{class:'lead',style:'margin:0'},`Found ${view.rows.length} assignments. Untick anything you don’t want and fix anything that looks off.`));
        if(past) kids.push(h('p',{class:'hint'},`${past} of them are already past, so they start unticked.`));
        if(view.failed) kids.push(h('p',{class:'hint'},`${view.failed} part${view.failed===1?'':'s'} of the document couldn’t be read, so a few items may be missing.`));
        const nClass = view.rows.filter(r=>r.kind==='class').length;
        if(nClass) kids.push(h('div',{class:'qrow',style:'margin-top:10px;gap:8px'},
          h('span',{style:'font-size:14px;font-weight:700'},'Add:'),
          h('div',{class:'qshort'},
            h('button',{type:'button','aria-pressed':String(view.show==='hw'),onclick:()=>{view.show='hw';applyPick();draw();}},'Homework & tests only'),
            h('button',{type:'button','aria-pressed':String(view.show==='all'),onclick:()=>{view.show='all';applyPick();draw();}},'Also class work')),
          h('span',{class:'hint',style:'margin:0'},`${nClass} in-class item${nClass===1?'':'s'} found`)));
        if(view.source==='local' && view.rows.some(r=>r.kind==='hw')) kids.push(h('label',{class:'chk',style:'margin-top:8px'},
          h('input',{type:'checkbox',id:'hwNext',checked:view.hwNext||null,onchange:e=>{view.hwNext=e.target.checked; applyShift(); applyPick(); draw();}}),
          'Homework is listed on the day it’s given, so it’s due the next class'));
        if(view.source==='local') kids.push(h('p',{class:'hint'},'Double-check names, types and dates before adding.'));
        kids.push(h('div',{class:'qrow',style:'margin-top:10px;gap:8px'},
          h('span',{style:'font-size:14px;font-weight:700'},'Put all in:'),
          h('select',{id:'pdfAll',class:'qdate',onchange:e=>{ if(e.target.value==='__new'){ view.newClassOpen=true; draw(); setTimeout(()=>document.getElementById('pdfNewClass')?.focus(),30); return; } if(e.target.value){ view.allClass=e.target.value; view.rows.forEach(r=>r.classId=e.target.value); draw(); toast(`All set to ${classById(e.target.value)?.name||'that class'}`); } }},
            h('option',{value:'',selected:!view.allClass||null},'Choose a class…'), ...classOpts(view.allClass||null), h('option',{value:'__new'},'+ New class…')),
          h('button',{type:'button',class:'btn sm',onclick:()=>{view.rows.forEach(r=>r.on=true);draw();toast(`Ticked all ${view.rows.length}`);}},'Tick all'),
          h('button',{type:'button',class:'btn sm',onclick:()=>{applyPick();draw();toast(`Ticked ${view.rows.filter(r=>r.on).length} upcoming`);}},'Only upcoming'),
          h('button',{type:'button',class:'btn sm',onclick:()=>{view.rows.forEach(r=>r.on=false);draw();toast('Unticked all');}},'Untick all')));
        if(view.newClassOpen) kids.push(newClassRow());
        kids.push(h('ul',{class:'found'}, ...view.rows.map(r=>h('li',{class:r.on?'':'off'},
          h('input',{type:'checkbox',id:'pc-'+r.key,checked:r.on||null,'aria-label':'Include '+r.title,onchange:e=>{r.on=e.target.checked; e.target.closest('li').classList.toggle('off',!r.on); updateCount();}}),
          h('input',{class:'ti',id:'pt-'+r.key,value:r.title,'aria-label':'Title',oninput:e=>{r.title=e.target.value;}}),
          h('select',{id:'py-'+r.key,'aria-label':'Type',onchange:e=>{r.type=e.target.value;}}, ...TYPES.map(([k,l])=>h('option',{value:k,selected:r.type===k||null},l))),
          h('input',{type:'date',id:'pd-'+r.key,value:r.due,'aria-label':'Due date',onchange:e=>{ if(e.target.value) r.due=e.target.value; }}),
          h('select',{id:'pk-'+r.key,'aria-label':'Class',onchange:e=>{r.classId=e.target.value;}}, ...classOpts(r.classId)),
          (r.notes || r.kind==='class') ? h('div',{class:'nt',text: r.kind==='class' ? 'In-class work (not homework)' : r.notes}) : null))));
        if(view.msg) kids.push(h('p',{class:'err',style:'margin:10px 0 0'},view.msg));
        const addBtn = h('button',{type:'button',class:'btn primary',id:'pdfAdd',onclick:addAll,disabled:!on||null},`Add ${on} to my planner`);
        var updateCount = () => { const n=view.rows.filter(r=>r.on).length; addBtn.textContent=`Add ${n} to my planner`; addBtn.disabled = !n; };
        kids.push(h('div',{class:'modal-foot',style:'margin-top:14px'},
          h('button',{type:'button',class:'btn',onclick:()=>{view.stage='pick';view.rows=[];draw();}},'Start over'),
          h('div',{class:'r'}, h('button',{type:'button',class:'btn',onclick:closeModal},'Cancel'), addBtn)));
      }
    }
    const list = box.querySelector('.found'), keep = list ? list.scrollTop : 0;
    const scrim = box.parentElement, keep2 = scrim ? scrim.scrollTop : 0;
    box.replaceChildren(...kids);
    const list2 = box.querySelector('.found'); if(list2) list2.scrollTop = keep;
    if(scrim) scrim.scrollTop = keep2;
  }
  draw();
  showModal(box);
}

init();
})();
</script>
